[package]
name = "rho-plugin-sdk"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-only"
repository = "https://github.com/YuLab-SMU/Rho"
description = "Public asynchronous backend SDK for the Rho plugin protocol"

[dependencies]
rho-plugin-protocol = { version = "0.1.0", path = "../plugin-protocol" }
tokio = { version = "1.0", features = ["io-util", "io-std", "sync", "rt", "macros", "net"] }
thiserror = "2.0"
serde_json = "1.0"
serde = "1.0"

[[example]]
name = "echo-backend"
path = "examples/echo.rs"

[[example]]
name = "resource-backend"
path = "examples/resource.rs"

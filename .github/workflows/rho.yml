name: Rho

on:
  push:
    branches: [main]
    paths: [".agents/skills/**", "crates/**", "r/**", "ui/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "vendor/**", "patches/jet/**", ".gitattributes", "governance/**", "docs/**", "scripts/**", "runtime/ark.json", ".github/workflows/rho.yml"]
  pull_request:
    paths: [".agents/skills/**", "crates/**", "r/**", "ui/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "vendor/**", "patches/jet/**", ".gitattributes", "governance/**", "docs/**", "scripts/**", "runtime/ark.json", ".github/workflows/rho.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rho-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native Host / macOS arm64
    runs-on: macos-26
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.97.0-aarch64-apple-darwin
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify CI target
        run: |
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "arm64"
          sw_vers
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy --no-self-update
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/db/
            target/
          key: rho-${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Install client build tool
        run: npm ci --ignore-scripts --prefix ui
      - name: Check production graph and source map
        run: |
          node scripts/vendor-jet.mjs check
          node scripts/test-vendor-jet.mjs
          node scripts/check-architecture.mjs
          node scripts/governance.mjs check
          node scripts/test-governance.mjs
          python3 scripts/test-pack-agent-evidence.py
      - name: Check frontend ownership and behavior
        run: |
          npm run typecheck --prefix ui
          npm run check:boundaries --prefix ui
          npm run test:boundaries --prefix ui
          npm run test --prefix ui
      - name: Format and lint
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test native foundation
        run: cargo test --workspace --locked -- --test-threads=1
      - name: Verify generated client and embedded assets
        run: node scripts/client.mjs check
      - name: Verify actual local public transports
        run: |
          node scripts/test-mcp.mjs
          node scripts/test-workbench.mjs
      - name: Verify standalone Ark acquisition fixtures (macOS)
        run: bash scripts/test-bootstrap-ark-macos.sh
      # Real Ark/R and remote-cluster acceptance have separate explicit prerequisites.
      # Ignored Rust tests above are not evidence of those runtime checks passing.

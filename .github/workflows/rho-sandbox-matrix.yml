name: Rho sandbox platform matrix

on:
  pull_request:
    paths:
      - "crates/rho-sandbox/**"
      - "crates/rho-execution/src/oci/**"
      - "test/security/platform/**"
      - "desktop/src-tauri/tauri.*.conf.json"
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 2"

permissions:
  contents: read

jobs:
  sandbox:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Sandbox and platform contracts
        run: cargo test -p rho-sandbox --locked
      - name: Matrix generation and fail-closed validation
        env:
          RHO_SKIP_REMOTE_PLATFORM: "1"
        run: node test/security/platform/check-matrix.mjs

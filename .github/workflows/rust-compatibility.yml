      - "scripts/test-extension-p2-4-trusted-update-contract.mjs"
      - "scripts/test-extension-p2-4-trusted-rollback-contract.mjs"
      - "scripts/test-extension-p2-4-recovery-closeout-contract.mjs"
      - "scripts/test-extension-phase-2-final-contract.mjs"
      - "scripts/test-rsr-*.mjs"
      - "scripts/test-signpath-candidate-workflow.mjs"
      - "scripts/test-conditional-prerelease-policy.mjs"
      - "scripts/test-tauri-native-updater-contract.mjs"
      - "scripts/test-tauri-bundle-type.mjs"
      - "scripts/test-three-platform-auto-updater.mjs"

    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - "crates/**/*.rs"
      - "desktop/src-tauri/**"
      - "r/rho.bridge/**"
      - "desktop/ui/**"
      - "desktop/dist/**"
      - "desktop/legal/**"
      - "desktop/package.json"
      - "desktop/package-lock.json"
      - "LICENSE"
      - "LICENSES.md"
      - "PRIVACY.md"
      - "SECURITY.md"
      - "CODE_SIGNING_POLICY.md"
      - "README.md"

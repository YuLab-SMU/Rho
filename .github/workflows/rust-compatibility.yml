permissions:
  contents: read

concurrency:
  group: rust-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-compatibility:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    name: ${{ matrix.os }} / Rust ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            toolchain: "stable"
            rustup_toolchain: stable-aarch64-apple-darwin
            host: aarch64-apple-darwin
          - os: macos-26
            toolchain: "1.88.0"
            rustup_toolchain: 1.88.0-aarch64-apple-darwin
            host: aarch64-apple-darwin
          - os: windows-latest
            toolchain: "stable"
            rustup_toolchain: stable-x86_64-pc-windows-gnu
            host: x86_64-pc-windows-gnu
          - os: windows-latest
            toolchain: "1.88.0"
            rustup_toolchain: 1.88.0-x86_64-pc-windows-gnu
            host: x86_64-pc-windows-gnu
          - os: ubuntu-22.04
            toolchain: "stable"
            rustup_toolchain: stable-x86_64-unknown-linux-gnu
            host: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04
            toolchain: "1.88.0"
            rustup_toolchain: 1.88.0-x86_64-unknown-linux-gnu
            host: x86_64-unknown-linux-gnu
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rustup_toolchain }}
      CARGO_INCREMENTAL: "0"

    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Windows Rtools
        if: runner.os == 'Windows'
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"
          rtools-version: "45"
          use-public-rspm: true

      - name: Set up R for Unix installed-app acceptance
        if: matrix.toolchain == 'stable' && runner.os != 'Windows'
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"
          use-public-rspm: true

      - name: Install Workspace smoke R dependency on Unix
        if: matrix.toolchain == 'stable' && runner.os != 'Windows'
        shell: bash
        run: Rscript -e "if (!requireNamespace('jsonlite', quietly = TRUE)) install.packages('jsonlite'); stopifnot(requireNamespace('jsonlite', quietly = TRUE))"

      - name: Install Workspace smoke R dependency on Windows
        if: matrix.toolchain == 'stable' && runner.os == 'Windows'
        shell: pwsh
        run: Rscript -e "if (!requireNamespace('jsonlite', quietly = TRUE)) install.packages('jsonlite'); stopifnot(requireNamespace('jsonlite', quietly = TRUE))"

      - name: Configure Windows GNU linker
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $rtools = "C:\rtools45\x86_64-w64-mingw32.static.posix\bin"
          if (-not (Test-Path -LiteralPath $rtools)) {
            throw "Expected Rtools45 GNU directory was not found: $rtools"
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "RHO_RTOOLS_BIN=C:\rtools45\x86_64-w64-mingw32.static.posix\bin"
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $rtools

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev squashfs-tools pkg-config unzip zip

      - name: Install and verify Linux Rust toolchain
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          rustup set profile minimal
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --no-self-update
          if [[ "${{ matrix.toolchain }}" == "stable" ]]; then rustup component add rustfmt --toolchain "$RUSTUP_TOOLCHAIN"; fi
          rustc -vV | grep -Fx "host: ${{ matrix.host }}"
          if [[ "${{ matrix.toolchain }}" == "1.88.0" ]]; then test "$(rustc -V | awk '{print $2}')" = "1.88.0"; fi

      - name: Install and verify macOS Rust toolchain
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          rustup set profile minimal
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --no-self-update
          if [[ "${{ matrix.toolchain }}" == "stable" ]]; then
            rustup component add rustfmt --toolchain "$RUSTUP_TOOLCHAIN"
          fi
          active="$(rustup show active-toolchain)"
          [[ "$active" == "$RUSTUP_TOOLCHAIN "* ]]
          rust_version="$(rustc -V | awk '{print $2}')"
          if [[ "${{ matrix.toolchain }}" == "1.88.0" ]]; then
            test "$rust_version" = "1.88.0"
          fi
          rustc -vV | grep -Fx "host: ${{ matrix.host }}"
          cargo -vV

      - name: Install and verify Windows GNU Rust toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH="$env:RHO_RTOOLS_BIN;$env:PATH"
          rustup set profile minimal
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --no-self-update
          if ("${{ matrix.toolchain }}" -eq "stable") {
            rustup component add rustfmt --toolchain $env:RUSTUP_TOOLCHAIN
          }
          $active = (& rustup show active-toolchain).Trim()
          if (-not $active.StartsWith("$env:RUSTUP_TOOLCHAIN ")) {
            throw "Expected $env:RUSTUP_TOOLCHAIN, received $active"
          }
          $rustVersion = ((& rustc -V).Trim() -split '\s+')[1]
          if ("${{ matrix.toolchain }}" -eq "1.88.0" -and $rustVersion -ne "1.88.0") {
            throw "Expected rustc 1.88.0, received $rustVersion"
          }
          $hostLine = (& rustc -vV | Select-String '^host: ').Line
          if ($hostLine -ne "host: ${{ matrix.host }}") {
            throw "Expected host ${{ matrix.host }}, received $hostLine"
          }
          cargo -vV

      - name: Restore Cargo dependency and build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: rho-rust-v1-${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rho-rust-v1-${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-

      - name: Stage pinned macOS Ark sidecar for Tauri compilation
        if: runner.os == 'macOS'
        shell: bash
        run: ./scripts/bootstrap-ark-macos.sh

      - name: Stage pinned Linux Ark sidecar for Tauri compilation
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ./scripts/bootstrap-ark-linux.sh
          ./scripts/prepare-runtime-resources.sh

      - name: Enforce current stable formatting
        if: matrix.toolchain == 'stable'
        run: cargo fmt --all -- --check

      - name: Verify installed license surface
        if: matrix.toolchain == 'stable'
        run: |
          node scripts/test-installed-license-surface.mjs
          node scripts/generate-update-site.mjs --test true
          node scripts/test-signpath-readiness.mjs --self-test
          node scripts/test-signpath-readiness.mjs
          node scripts/test-signpath-free-trial-smoke.mjs --self-test
          node scripts/test-signpath-free-trial-smoke.mjs
          node scripts/candidate-release.mjs --test true
          node scripts/test-signpath-candidate-workflow.mjs --self-test
          node scripts/test-signpath-candidate-workflow.mjs
          node scripts/test-conditional-prerelease-policy.mjs
          node --check desktop/dist/app.js
          node scripts/test-macos-notary.mjs
          node scripts/test-mac4-release-contract.mjs
          node scripts/test-tauri-native-updater-contract.mjs
          node scripts/test-native-updater-acceptance-transport.mjs
          node scripts/test-three-platform-auto-updater.mjs

      - name: Verify locked workspace at selected Rust version
        run: |
          node scripts/test-rust-msrv-contract.mjs
          node scripts/test-tauri-command-inventory.mjs --test
          node scripts/test-tauri-command-inventory.mjs
          node scripts/test-extension-phase-1-acceptance.mjs --test
          node scripts/test-extension-phase-1-acceptance.mjs
          node scripts/test-extension-phase-2-host-contract.mjs --test
          node scripts/test-extension-phase-2-host-contract.mjs
          node scripts/test-extension-p2-2-broker-contract.mjs --test
          node scripts/test-extension-p2-2-broker-contract.mjs
          node scripts/test-extension-p2-3-contribution-contract.mjs --test
          node scripts/test-extension-p2-3-contribution-contract.mjs
          node scripts/test-extension-p2-4-lifecycle-contract.mjs --test
          node scripts/test-extension-p2-4-lifecycle-contract.mjs
          node scripts/test-extension-p2-4-package-cache-contract.mjs --test
          node scripts/test-extension-p2-4-package-cache-contract.mjs
          node scripts/test-extension-p2-4-durable-enable-contract.mjs --test
          node scripts/test-extension-p2-4-durable-enable-contract.mjs
          node scripts/test-extension-p2-4-restart-contract.mjs --test
          node scripts/test-extension-p2-4-restart-contract.mjs
          node scripts/test-extension-p2-4-disable-contract.mjs --test
          node scripts/test-extension-p2-4-disable-contract.mjs
          node scripts/test-extension-p2-4-boundary-teardown-contract.mjs --test
          node scripts/test-extension-p2-4-boundary-teardown-contract.mjs
          node scripts/test-extension-p2-4-crash-retry-contract.mjs --test
          node scripts/test-extension-p2-4-crash-retry-contract.mjs
          node scripts/test-extension-p2-4-package-trash-contract.mjs --test
          node scripts/test-extension-p2-4-package-trash-contract.mjs
          node scripts/test-extension-p2-4-uninstall-restore-contract.mjs --test
          node scripts/test-extension-p2-4-uninstall-restore-contract.mjs
          node scripts/test-extension-p2-4-retention-purge-contract.mjs --test
          node scripts/test-extension-p2-4-retention-purge-contract.mjs
          node scripts/test-extension-p2-4-replacement-foundation-contract.mjs --test
          node scripts/test-extension-p2-4-replacement-foundation-contract.mjs
          node scripts/test-extension-p2-4-trusted-update-contract.mjs --test
          node scripts/test-extension-p2-4-trusted-update-contract.mjs
          node scripts/test-extension-p2-4-trusted-rollback-contract.mjs --test
          node scripts/test-extension-p2-4-trusted-rollback-contract.mjs
          node scripts/test-workspace-plugin-ui.mjs
          cargo check --workspace --all-targets --locked
          cargo test --workspace --locked --no-fail-fast

      - name: Build, install, smoke and remove unsigned Windows app
        if: matrix.toolchain == 'stable' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:PATH="$env:RHO_RTOOLS_BIN;$env:PATH"
          $keyDirectory = Join-Path $env:RUNNER_TEMP "rho-p1-windows-updater-key"
          New-Item -ItemType Directory -Path $keyDirectory -Force | Out-Null
          $keyPath = Join-Path $keyDirectory "private.key"
          & npx.cmd -y "@tauri-apps/cli@2.11.4" signer generate --ci --write-keys $keyPath
          if ($LASTEXITCODE -ne 0) { throw "Could not create ephemeral Tauri key." }
          $env:TAURI_SIGNING_PRIVATE_KEY = Get-Content -LiteralPath $keyPath -Raw
          $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = ""
          try {
            ./scripts/bootstrap-ark-windows.ps1
            if ($LASTEXITCODE -ne 0) { throw "Windows Ark bootstrap failed." }
            ./scripts/build-windows-installer.ps1
            if ($LASTEXITCODE -ne 0) { throw "Windows installer build failed." }
            $version = (Get-Content desktop\src-tauri\tauri.conf.json -Raw | ConvertFrom-Json).version
            $binary = (Resolve-Path target\release\rho-desktop.exe).Path
            $installer = @(Get-ChildItem target\release\bundle\nsis\Rho_*-setup.exe -File)
            if ($installer.Count -ne 1 -or $installer[0].Name -ne "Rho_${version}_x64-setup.exe") {
              throw "Expected one versioned NSIS installer."
            }
            Remove-Item Env:RHO_INTERNAL_EXTENSION_RUNTIME -ErrorAction SilentlyContinue
            & $binary --smoke-test
            if ($LASTEXITCODE -ne 0) { throw "Unbundled default-candidate smoke failed." }
            $env:RHO_INTERNAL_EXTENSION_RUNTIME = "legacy"
            & $binary --smoke-test
            if ($LASTEXITCODE -ne 0) { throw "Unbundled legacy smoke failed." }
            Remove-Item Env:RHO_INTERNAL_EXTENSION_RUNTIME -ErrorAction SilentlyContinue

            function Get-RhoUninstallEntry {
              Get-ItemProperty -Path @(
                "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*",
                "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*",
                "HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*"
              ) -ErrorAction SilentlyContinue |
                Where-Object { $_.DisplayName -eq "Rho" -or $_.DisplayName -like "Rho *" } |
                Select-Object -First 1
            }
            if (Get-RhoUninstallEntry) { throw "Hosted runner already contains Rho." }
            $installedExecutable = $null
            $uninstaller = $null
            try {
              $install = Start-Process -FilePath $installer[0].FullName -ArgumentList "/S" -PassThru -Wait
              if ($install.ExitCode -ne 0) { throw "NSIS install failed with $($install.ExitCode)." }
              $entry = Get-RhoUninstallEntry
              if (-not $entry -or [string]$entry.DisplayVersion -ne $version) {
                throw "Installed Rho registry identity is missing or stale."
              }
              $locations = @(
                (Join-Path $env:LOCALAPPDATA "Rho\rho-desktop.exe"),
                (Join-Path $env:LOCALAPPDATA "Programs\Rho\rho-desktop.exe")
              )
              if ($entry.InstallLocation) {
                $installLocation = ([string]$entry.InstallLocation).Trim().Trim('"')
                $locations += Join-Path $installLocation "rho-desktop.exe"
                $locations += Join-Path $installLocation "Rho.exe"
              }
              $installedExecutable = $locations | Where-Object { $_ -and (Test-Path -LiteralPath $_ -PathType Leaf) } | Select-Object -First 1
              if (-not $installedExecutable) {
                $installedExecutable = Get-ChildItem -LiteralPath $env:LOCALAPPDATA -Filter "rho-desktop.exe" -File -Recurse -Depth 5 -ErrorAction SilentlyContinue |
                  Select-Object -ExpandProperty FullName -First 1
              }
              if (-not $installedExecutable) { throw "Installed Rho executable was not found." }
              $installedExecutable = (Resolve-Path -LiteralPath $installedExecutable).Path
              if ($installedExecutable.StartsWith((Resolve-Path $env:GITHUB_WORKSPACE).Path, [System.StringComparison]::OrdinalIgnoreCase)) {
                throw "Installed executable remained inside the source workspace."
              }
              Remove-Item Env:RHO_INTERNAL_EXTENSION_RUNTIME -ErrorAction SilentlyContinue
              & $installedExecutable --smoke-test
              if ($LASTEXITCODE -ne 0) { throw "Installed default-candidate smoke failed." }
              $env:RHO_INTERNAL_EXTENSION_RUNTIME = "legacy"
              & $installedExecutable --smoke-test
              if ($LASTEXITCODE -ne 0) { throw "Installed legacy smoke failed." }
              Remove-Item Env:RHO_INTERNAL_EXTENSION_RUNTIME -ErrorAction SilentlyContinue
              $match = [regex]::Match([string]$entry.UninstallString, '^"?(.+?\.exe)"?(?:\s.*)?$')
              if ($match.Success) { $uninstaller = $match.Groups[1].Value }
              if (-not $uninstaller -or -not (Test-Path -LiteralPath $uninstaller -PathType Leaf)) {
                throw "Installed Rho uninstaller was not found."
              }
              Write-Host "Windows binary SHA-256: $((Get-FileHash $binary -Algorithm SHA256).Hash.ToLowerInvariant())"
              Write-Host "Windows installer SHA-256: $((Get-FileHash $installer[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant())"
            }
            finally {
              Remove-Item Env:RHO_INTERNAL_EXTENSION_RUNTIME -ErrorAction SilentlyContinue
              Get-Process -Name "rho-desktop" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
              $cleanupEntry = Get-RhoUninstallEntry
              if ((-not $uninstaller -or -not (Test-Path -LiteralPath $uninstaller -PathType Leaf)) -and $cleanupEntry -and $cleanupEntry.UninstallString) {
                $cleanupMatch = [regex]::Match([string]$cleanupEntry.UninstallString, '^"?(.+?\.exe)"?(?:\s.*)?$')
                if ($cleanupMatch.Success) { $uninstaller = $cleanupMatch.Groups[1].Value }
              }
              if ($uninstaller -and (Test-Path -LiteralPath $uninstaller -PathType Leaf)) {
                $cleanup = Start-Process -FilePath $uninstaller -ArgumentList "/S" -PassThru -Wait
                if ($cleanup.ExitCode -ne 0) { throw "Rho uninstall failed with $($cleanup.ExitCode)." }
              }
              for ($attempt = 0; $attempt -lt 60; $attempt += 1) {
                $registryRemoved = -not [bool](Get-RhoUninstallEntry)
                $executableRemoved = -not $installedExecutable -or -not (Test-Path -LiteralPath $installedExecutable -PathType Leaf)
                if ($registryRemoved -and $executableRemoved) { break }
                Start-Sleep -Milliseconds 500
              }
              if (Get-RhoUninstallEntry) { throw "Rho uninstall registry cleanup failed." }
              if ($installedExecutable -and (Test-Path -LiteralPath $installedExecutable -PathType Leaf)) {
                throw "Rho uninstall executable cleanup failed."
              }
            }
          }
          finally {
            Remove-Item Env:TAURI_SIGNING_PRIVATE_KEY -ErrorAction SilentlyContinue
            Remove-Item Env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $keyDirectory -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Build, mount and smoke unsigned macOS app
        if: matrix.toolchain == 'stable' && runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          key_dir="$(mktemp -d "$RUNNER_TEMP/rho-p1-macos-key.XXXXXX")"
          key_path="$key_dir/private.key"
          mount_dir="$(mktemp -d "$RUNNER_TEMP/rho-p1-macos-mount.XXXXXX")"
          mounted=0
          cleanup() {
            if [[ "$mounted" == 1 ]]; then hdiutil detach "$mount_dir" -force >/dev/null || true; fi
            rm -rf -- "$key_dir" "$mount_dir"
          }
          trap cleanup EXIT
          npx -y "@tauri-apps/cli@2.11.4" signer generate --ci --write-keys "$key_path"
          export TAURI_SIGNING_PRIVATE_KEY="$(cat "$key_path")"
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD=""
          (cd desktop/src-tauri && npx -y "@tauri-apps/cli@2.11.4" build --target aarch64-apple-darwin --bundles app,dmg)
          version="$(node -e 'const fs=require("fs"); process.stdout.write(JSON.parse(fs.readFileSync("desktop/src-tauri/tauri.conf.json","utf8")).version)')"
          app="target/aarch64-apple-darwin/release/bundle/macos/Rho.app"
          dmg="target/aarch64-apple-darwin/release/bundle/dmg/Rho_${version}_aarch64.dmg"
          test -x "$app/Contents/MacOS/rho-desktop"
          test -f "$dmg"
          test "$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")" = "$version"
          test "$(lipo -archs "$app/Contents/MacOS/rho-desktop")" = "arm64"
          ark="$(find "$app/Contents/MacOS" -maxdepth 1 -type f -name 'ark*' -print -quit)"
          test -n "$ark"
          test "$(lipo -archs "$ark")" = "arm64"
          test -f "$app/Contents/Resources/licenses/rho/LICENSE.txt"
          cmp -s LICENSE "$app/Contents/Resources/licenses/rho/LICENSE.txt"
          env -u RHO_INTERNAL_EXTENSION_RUNTIME "$app/Contents/MacOS/rho-desktop" --smoke-test
          RHO_INTERNAL_EXTENSION_RUNTIME=legacy "$app/Contents/MacOS/rho-desktop" --smoke-test
          hdiutil verify "$dmg"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "$dmg" >/dev/null
          mounted=1
          mounted_app="$mount_dir/Rho.app"
          test -x "$mounted_app/Contents/MacOS/rho-desktop"
          env -u RHO_INTERNAL_EXTENSION_RUNTIME "$mounted_app/Contents/MacOS/rho-desktop" --smoke-test
          RHO_INTERNAL_EXTENSION_RUNTIME=legacy "$mounted_app/Contents/MacOS/rho-desktop" --smoke-test
          shasum -a 256 "$app/Contents/MacOS/rho-desktop" "$dmg"

      - name: Build, extract and smoke unsigned Linux AppImage
        if: matrix.toolchain == 'stable' && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          key_dir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/rho-p1-linux-key.XXXXXX")"
          extract_dir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/rho-p1-linux-extract.XXXXXX")"
          cleanup() { rm -rf -- "$key_dir" "$extract_dir"; }
          trap cleanup EXIT
          key_path="$key_dir/private.key"
          npx -y "@tauri-apps/cli@2.11.4" signer generate --ci --write-keys "$key_path"
          export TAURI_SIGNING_PRIVATE_KEY="$(cat "$key_path")"
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD=""
          scripts/build-linux.sh
          version="$(node -e 'const fs=require("fs"); process.stdout.write(JSON.parse(fs.readFileSync("desktop/src-tauri/tauri.conf.json","utf8")).version)')"
          appimage="target/release/bundle/appimage/Rho_${version}_x86_64.AppImage"
          test -x "$appimage"
          (cd "$extract_dir" && "$GITHUB_WORKSPACE/$appimage" --appimage-extract >/dev/null)
          executable="$(find "$extract_dir/squashfs-root" -type f -name rho-desktop -perm -111 -print -quit)"
          test -n "$executable"
          file -b "$executable" | grep -Eq 'ELF 64-bit.*x86-64'
          app_run="$extract_dir/squashfs-root/AppRun"
          test -x "$app_run"
          test -f "$extract_dir/squashfs-root/usr/share/licenses/rho/LICENSE.txt" || find "$extract_dir/squashfs-root" -path '*/licenses/rho/LICENSE.txt' -type f -print -quit | grep -q .
          env -u RHO_INTERNAL_EXTENSION_RUNTIME "$app_run" --smoke-test
          RHO_INTERNAL_EXTENSION_RUNTIME=legacy "$app_run" --smoke-test
          sha256sum "$executable" "$appimage"

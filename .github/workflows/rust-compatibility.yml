      - "scripts/test-extension-p1-3-contract.mjs"
      - "scripts/test-extension-phase-2-host-contract.mjs"
      - "scripts/test-extension-p2-2-broker-contract.mjs"
      - "scripts/test-extension-p2-3-contribution-contract.mjs"

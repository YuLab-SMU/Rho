name: Build Rho Candidate / Rehearsal

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: Rehearsal uploads review artifacts; candidate creates a main-repository draft
        required: true
        default: rehearsal
        type: choice
        options:
          - rehearsal
          - candidate
      ref:
        description: Exact current default-branch commit or ref to build
        required: true
        default: main
      release_tag:
        description: Single-use prerelease tag
        required: true
        default: v0.4.0-dev.43
      release_name:
        description: Draft release title
        required: true
        default: Rho 0.4.0-dev.43

permissions:
  contents: read

concurrency:
  group: rho-${{ inputs.build_mode }}-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  identity:
    name: Resolve immutable candidate identity
    runs-on: ubuntu-latest
    outputs:
      build_mode: ${{ steps.identity.outputs.build_mode }}
      commit: ${{ steps.identity.outputs.commit }}
      version: ${{ steps.identity.outputs.version }}
      release_tag: ${{ steps.identity.outputs.release_tag }}
      release_name: ${{ steps.identity.outputs.release_name }}
    steps:
      - name: Check out trusted default-branch dispatcher
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate candidate identity and contract tools
        id: identity
        shell: bash
        env:
          BUILD_MODE: ${{ inputs.build_mode }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          set -euo pipefail
          node scripts/candidate-release.mjs --mode admission --build_mode "$BUILD_MODE" --repository "$GITHUB_REPOSITORY" --workflow_ref "$GITHUB_REF" --default_branch "$DEFAULT_BRANCH"
          commit="$(git rev-parse "${INPUT_REF}^{commit}")"
          default_commit="$(git rev-parse HEAD)"
          if [[ "$commit" != "$default_commit" ]]; then
            echo "Requested commit $commit is not the current default-branch commit $default_commit." >&2
            exit 1
          fi
          version="$(node -e 'const fs=require("fs"); const value=fs.readFileSync("Cargo.toml", "utf8").match(/^version = "([^"]+)"/m); if(!value) process.exit(1); process.stdout.write(value[1])')"
          expected_release_name="Rho $version"
          if [[ "$version" == "0.4.0-dev.41" ]]; then
            expected_release_name="Rho 0.4.0-dev.41 Native Updater Acceptance Target"
          fi
          test "$INPUT_RELEASE_NAME" = "$expected_release_name"
          node scripts/candidate-release.mjs --mode identity --version "$version" --tag "$INPUT_RELEASE_TAG" --commit "$commit"
          node scripts/candidate-release.mjs --test true
          node scripts/release-notes.mjs --test true
          node scripts/native-updater-acceptance.mjs --test true
          if [[ "$BUILD_MODE" == "candidate" ]]; then
            node scripts/release-notes.mjs --mode validate --version "$version" --tag "$INPUT_RELEASE_TAG"
          fi
          node scripts/test-release-notes-workflow.mjs
          node scripts/generate-update-site.mjs --test true
          node scripts/test-macos-notary.mjs
          node scripts/test-mac4-release-contract.mjs
          {
            echo "build_mode=$BUILD_MODE"
            echo "commit=$commit"
            echo "version=$version"
            echo "release_tag=$INPUT_RELEASE_TAG"
            echo "release_name=$INPUT_RELEASE_NAME"
          } >> "$GITHUB_OUTPUT"

  windows-candidate:
    name: Build Windows x64 candidate
    needs: identity
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out immutable candidate commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.identity.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove checked-out identity
        shell: pwsh
        env:
          EXPECTED_COMMIT: ${{ needs.identity.outputs.commit }}
        run: |
          if ((& git rev-parse HEAD).Trim() -ne $env:EXPECTED_COMMIT) { throw "Windows checkout identity mismatch." }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up R and Rtools
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"
          rtools-version: "45"
          use-public-rspm: true

      - name: Install R test dependencies
        shell: pwsh
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Rscript -e "if (!requireNamespace('remotes', quietly = TRUE)) install.packages('remotes')"
          Rscript -e "remotes::install_deps('r/rho.bridge', dependencies = TRUE, upgrade = 'never')"
          Rscript -e "remotes::install_deps('r/rho.agent', dependencies = TRUE, upgrade = 'never')"

      - name: Install Windows GNU Rust toolchain
        shell: pwsh
        run: |
          rustup set profile minimal
          rustup toolchain install stable-x86_64-pc-windows-gnu --no-self-update
          rustup component add rustfmt --toolchain stable-x86_64-pc-windows-gnu
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "RUSTUP_TOOLCHAIN=stable-x86_64-pc-windows-gnu"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "RHO_RTOOLS_BIN=C:\rtools45\x86_64-w64-mingw32.static.posix\bin"
          $rscript = (& Rscript -e "cat(normalizePath(file.path(R.home('bin'), 'Rscript.exe'), winslash='/', mustWork=TRUE))").Trim()
          if (-not $rscript) { throw "Could not resolve Rscript.exe." }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "RHO_RSCRIPT=$rscript"

      - name: Bootstrap pinned Windows Ark runtime
        shell: pwsh
        run: |
          $env:PATH="$env:RHO_RTOOLS_BIN;$env:PATH"
          ./scripts/bootstrap-ark-windows.ps1 -RscriptPath "$env:RHO_RSCRIPT"

      - name: Run complete Windows candidate validation
        shell: pwsh
        run: |
          $env:PATH="$env:RHO_RTOOLS_BIN;$env:PATH"
          cargo fmt --all -- --check
          cargo test --workspace --locked --no-fail-fast
          Rscript -e "testthat::test_local('r/rho.bridge', reporter = 'summary')"
          Rscript -e "testthat::test_local('r/rho.agent', reporter = 'summary')"
          node --check desktop/dist/app.js
          Get-ChildItem -LiteralPath scripts -Filter "test-*.mjs" | Sort-Object Name | ForEach-Object {
            & node $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Failed deterministic test: $($_.Name)" }
          }

      - name: Build and smoke-test unsigned Windows executable
        shell: pwsh
        env:
          CANDIDATE_MODE: ${{ needs.identity.outputs.build_mode }}
          CANDIDATE_VERSION: ${{ needs.identity.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ needs.identity.outputs.build_mode == 'candidate' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ needs.identity.outputs.build_mode == 'candidate' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          if ($env:CANDIDATE_MODE -eq "candidate") {
            if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY) -or [string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
              throw "Candidate native updater signing secrets are required."
            }
            ./scripts/build-windows-installer.ps1 -BuildMode NoBundle
          } else {
            $ephemeralKey = Join-Path $env:RUNNER_TEMP "rho-rehearsal-tauri-updater.key"
            & npx -y "@tauri-apps/cli@2.11.4" signer generate --ci --write-keys "$ephemeralKey"
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $ephemeralKey -PathType Leaf)) {
              throw "Could not create an ephemeral rehearsal updater key."
            }
            $env:TAURI_SIGNING_PRIVATE_KEY = Get-Content -LiteralPath $ephemeralKey -Raw
            $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = ""
            ./scripts/build-windows-installer.ps1 -BuildMode Full
          }
          $binary = Join-Path $PWD "target\release\rho-desktop.exe"
          & $binary --smoke-test
          if ($LASTEXITCODE -ne 0) { throw "Windows Workspace smoke failed." }
          $binarySignature = Get-AuthenticodeSignature -LiteralPath $binary
          if ([string]$binarySignature.Status -ne "NotSigned" -or $null -ne $binarySignature.SignerCertificate) {
            throw "Initial Windows executable must be unsigned."
          }
          if ($env:CANDIDATE_MODE -eq "rehearsal") {
            $expected = "Rho_$($env:CANDIDATE_VERSION)_x64-setup.exe"
            $installer = @(Get-ChildItem -LiteralPath "target\release\bundle\nsis" -Filter "*-setup.exe" -File)
            if ($installer.Count -ne 1 -or $installer[0].Name -ne $expected) { throw "Expected exactly $expected." }
            $bundlerSignature = Join-Path $installer[0].DirectoryName "$expected.sig"
            if (-not (Test-Path -LiteralPath $bundlerSignature -PathType Leaf)) {
              throw "Tauri did not create the required updater artifact signature."
            }
            New-Item -ItemType Directory -Path "target\candidate" -Force | Out-Null
            Copy-Item -LiteralPath $installer[0].FullName -Destination (Join-Path "target\candidate" $expected)
          }

      - name: Patch unsigned Windows executable for exact NSIS bundle type
        if: ${{ needs.identity.outputs.build_mode == 'candidate' }}
        shell: pwsh
        run: |
          $binary = Join-Path $PWD "target\release\rho-desktop.exe"
          & node scripts/tauri-bundle-type.mjs --mode patch --file $binary
          if ($LASTEXITCODE -ne 0) { throw "Exact Tauri NSIS bundle-type patch failed." }
          & $binary --smoke-test
          if ($LASTEXITCODE -ne 0) { throw "NSIS-patched Windows Workspace smoke failed." }
          $signature = Get-AuthenticodeSignature -LiteralPath $binary
          if ([string]$signature.Status -ne "NotSigned" -or $null -ne $signature.SignerCertificate) {
            throw "NSIS-patched Windows executable must remain unsigned before SignPath."
          }

      - name: Load protected SignPath deployment configuration
        if: ${{ needs.identity.outputs.build_mode == 'candidate' }}
        shell: pwsh
        env:
          SIGNPATH_DEPLOYMENT_CONFIG: ${{ secrets.SIGNPATH_DEPLOYMENT_CONFIG }}
          SIGNPATH_BINARY_ARTIFACT_CONFIGURATION_SLUG: ${{ secrets.SIGNPATH_BINARY_ARTIFACT_CONFIGURATION_SLUG }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNPATH_DEPLOYMENT_CONFIG)) {
            throw "Required protected SignPath deployment configuration is missing."
          }
          try {
            $config = ConvertFrom-Json -InputObject $env:SIGNPATH_DEPLOYMENT_CONFIG -AsHashtable -ErrorAction Stop
          } catch {
            throw "Protected SignPath deployment configuration is not valid JSON."
          }
          if ($config -isnot [System.Collections.IDictionary]) {
            throw "Protected SignPath deployment configuration must be a JSON object."
          }
          $required = @(
            "SIGNPATH_ORGANIZATION_ID",
            "SIGNPATH_PROJECT_SLUG",
            "SIGNPATH_SIGNING_POLICY_SLUG",
            "SIGNPATH_ARTIFACT_CONFIGURATION_SLUG",
            "SIGNPATH_CERTIFICATE_THUMBPRINT"
          )
          if (@(Compare-Object -ReferenceObject @($required | Sort-Object) -DifferenceObject @($config.Keys | Sort-Object)).Count -ne 0) {
            throw "Protected SignPath deployment configuration has an unexpected key set."
          }
          $validated = @{}
          foreach ($name in $required) {
            if (-not $config.ContainsKey($name) -or $config[$name] -isnot [string]) {
              throw "Protected SignPath deployment configuration contains a non-string value: $name"
            }
            $value = [string]$config[$name]
            if ([string]::IsNullOrWhiteSpace($value) -or $value -match "[\r\n]") {
              throw "Protected SignPath deployment configuration contains a blank or multiline value: $name"
            }
            $validated[$name] = $value
          }
          if ($validated.SIGNPATH_ORGANIZATION_ID -notmatch '^[0-9A-Fa-f]{8}-(?:[0-9A-Fa-f]{4}-){3}[0-9A-Fa-f]{12}$') {
            throw "SIGNPATH_ORGANIZATION_ID must be a UUID."
          }
          foreach ($name in @("SIGNPATH_PROJECT_SLUG", "SIGNPATH_SIGNING_POLICY_SLUG", "SIGNPATH_ARTIFACT_CONFIGURATION_SLUG")) {
            if ($validated[$name] -notmatch '^[A-Za-z0-9._-]+$') {
              throw "Protected SignPath deployment configuration contains an invalid slug: $name"
            }
          }
          $thumbprint = ($validated.SIGNPATH_CERTIFICATE_THUMBPRINT -replace '[^0-9A-Fa-f]', '').ToUpperInvariant()
          if ($thumbprint -notmatch '^[0-9A-F]{40}$') {
            throw "SIGNPATH_CERTIFICATE_THUMBPRINT must be a 40-digit SHA-1 certificate thumbprint."
          }
          $validated.SIGNPATH_CERTIFICATE_THUMBPRINT = $thumbprint
          $binaryConfigurationSlug = [string]$env:SIGNPATH_BINARY_ARTIFACT_CONFIGURATION_SLUG
          if ([string]::IsNullOrWhiteSpace($binaryConfigurationSlug) -or $binaryConfigurationSlug -match "[\r\n]") {
            throw "SIGNPATH_BINARY_ARTIFACT_CONFIGURATION_SLUG contains a blank or multiline value."
          }
          if ($binaryConfigurationSlug -notmatch '^[A-Za-z0-9._-]+$') {
            throw "SIGNPATH_BINARY_ARTIFACT_CONFIGURATION_SLUG contains an invalid slug."
          }
          if ($binaryConfigurationSlug -eq $validated.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG) {
            throw "SIGNPATH_BINARY_ARTIFACT_CONFIGURATION_SLUG must differ from the installer artifact configuration slug."
          }
          foreach ($name in $required) {
            $value = $validated[$name]
            Write-Output "::add-mask::$value"
            Add-Content -LiteralPath $env:GITHUB_ENV -Value "$name=$value" -Encoding utf8
          }
          Write-Output "::add-mask::$binaryConfigurationSlug"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "SIGNPATH_BINARY_ARTIFACT_CONFIGURATION_SLUG=$binaryConfigurationSlug" -Encoding utf8

      - name: Verify and isolate exact unsigned Windows executable
        if: ${{ needs.identity.outputs.build_mode == 'candidate' }}
        shell: pwsh
        run: |
          $expected = "rho-desktop.exe"
          $binary = Join-Path $PWD "target\release\$expected"
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
            throw "Expected unsigned Windows executable is missing."
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $binary
          if ([string]$signature.Status -ne "NotSigned" -or $null -ne $signature.SignerCertificate) {
            throw "Windows executable signing input must be exactly unsigned."
          }
          $unsignedHash = (Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant()
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "RHO_UNSIGNED_BINARY_SHA256=$unsignedHash" -Encoding utf8
          New-Item -ItemType Directory -Path "target\signpath-binary-input" -Force | Out-Null
          $isolatedBinary = Join-Path $PWD "target\signpath-binary-input\$expected"
          Copy-Item -LiteralPath $binary -Destination $isolatedBinary
          $inputArchive = Join-Path $PWD "target\signpath-binary-input\rho-signpath-binary-input.zip"
          Compress-Archive -LiteralPath $isolatedBinary -DestinationPath $inputArchive
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($inputArchive)
          try {
            $entries = @($archive.Entries | Where-Object { -not [string]::IsNullOrEmpty($_.Name) })
            if ($entries.Count -ne 1 -or $entries[0].FullName -ne $expected) {
              throw "The SignPath binary input ZIP must contain exactly rho-desktop.exe at its root."
            }
          } finally {
            $archive.Dispose()
          }

      - name: Prepare fixed official SignPath module
        if: ${{ needs.identity.outputs.build_mode == 'candidate' }}
        shell: pwsh
        env:
          SIGNPATH_MODULE_VERSION: "4.4.6"
          SIGNPATH_MODULE_SHA256: 4a732624a7214dc8290dbf81ed2714d6b509be319427c2d55fd0c679d13ab5ae
        run: |
          Install-Module -Name SignPath -RequiredVersion $env:SIGNPATH_MODULE_VERSION -Repository PSGallery -Scope CurrentUser -Force -AllowClobber -ErrorAction Stop
          $module = Get-Module -ListAvailable -Name SignPath |
            Where-Object { $_.Version.ToString() -eq $env:SIGNPATH_MODULE_VERSION } |
            Select-Object -First 1
          if ($null -eq $module) {
            throw "SignPath module $env:SIGNPATH_MODULE_VERSION was not installed."
          }
          $moduleFile = Join-Path $module.ModuleBase "SignPath.psm1"
          $moduleHash = (Get-FileHash -LiteralPath $moduleFile -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($moduleHash -ne $env:SIGNPATH_MODULE_SHA256) {
            throw "SignPath module integrity mismatch."
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "SIGNPATH_MODULE_VERSION=$($env:SIGNPATH_MODULE_VERSION)" -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "SIGNPATH_MODULE_SHA256=$moduleHash" -Encoding utf8

      - name: Submit exact Windows executable through official SignPath REST module
        if: ${{ needs.identity.outputs.build_mode == 'candidate' }}
        id: binary-signpath
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          CANDIDATE_VERSION: ${{ needs.identity.outputs.version }}
          CANDIDATE_COMMIT: ${{ needs.identity.outputs.commit }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNPATH_API_TOKEN)) {
            throw "Required SignPath API token is missing."
          }
          $module = Get-Module -ListAvailable -Name SignPath |
            Where-Object { $_.Version.ToString() -eq $env:SIGNPATH_MODULE_VERSION } |
            Select-Object -First 1
          if ($null -eq $module) {
            throw "The verified SignPath module is unavailable."
          }
          $moduleFile = Join-Path $module.ModuleBase "SignPath.psm1"
          $moduleHash = (Get-FileHash -LiteralPath $moduleFile -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($moduleHash -ne $env:SIGNPATH_MODULE_SHA256) {
            throw "The SignPath module changed after verification."
          }
          Import-Module -Name $module.Path -Force -ErrorAction Stop
          $inputArchive = Join-Path $PWD "target\signpath-binary-input\rho-signpath-binary-input.zip"
          $outputDirectory = Join-Path $PWD "target\signpath-binary-output"
          New-Item -ItemType Directory -Path $outputDirectory -Force | Out-Null
          $signedArchive = Join-Path $outputDirectory "rho-signpath-binary-output.zip"
          $signingRequestId = Submit-SigningRequest `
            -InputArtifactPath $inputArchive `
            -ProjectSlug $env:SIGNPATH_PROJECT_SLUG `
            -SigningPolicySlug $env:SIGNPATH_SIGNING_POLICY_SLUG `
            -ArtifactConfigurationSlug $env:SIGNPATH_BINARY_ARTIFACT_CONFIGURATION_SLUG `
            -WaitForCompletion `
            -OutputArtifactPath $signedArchive `
            -WaitForCompletionTimeoutInSeconds 900 `
            -UploadAndDownloadRequestTimeoutInSeconds 300 `
            -OrganizationId $env:SIGNPATH_ORGANIZATION_ID `
            -ApiToken $env:SIGNPATH_API_TOKEN `
            -Description "Rho executable $env:CANDIDATE_VERSION at $env:CANDIDATE_COMMIT run $env:GITHUB_RUN_ID attempt $env:GITHUB_RUN_ATTEMPT"
          $signingRequestId = ([string]$signingRequestId).ToLowerInvariant()
          if ($signingRequestId -notmatch '^[0-9a-f]{8}-(?:[0-9a-f]{4}-){3}[0-9a-f]{12}$') {
            throw "SignPath did not return a signing request identifier."
          }
          if (-not (Test-Path -LiteralPath $signedArchive -PathType Leaf)) {
            throw "SignPath did not return the signed ZIP."
          }
          Write-Output "binary_signing_request_id=$signingRequestId" >> $env:GITHUB_OUTPUT

      - name: Verify and promote returned test-signed Windows executable
        if: ${{ needs.identity.outputs.build_mode == 'candidate' }}
        shell: pwsh
        env:
          BINARY_SIGNING_REQUEST_ID: ${{ steps.binary-signpath.outputs.binary_signing_request_id }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:BINARY_SIGNING_REQUEST_ID)) {
            throw "SignPath did not return a binary signing request identifier."
          }
          $expected = "rho-desktop.exe"
          $signedArchive = Join-Path $PWD "target\signpath-binary-output\rho-signpath-binary-output.zip"
          $extractedDirectory = Join-Path $PWD "target\signpath-binary-output\extracted"
          New-Item -ItemType Directory -Path $extractedDirectory -Force | Out-Null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($signedArchive)
          try {
            $entries = @($archive.Entries | Where-Object { -not [string]::IsNullOrEmpty($_.Name) })
            if ($entries.Count -ne 1 -or $entries[0].FullName -ne $expected) {
              throw "The returned SignPath binary ZIP must contain exactly rho-desktop.exe at its root."
            }
            $returnedBinary = Join-Path $extractedDirectory $expected
            [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entries[0], $returnedBinary, $false)
          } finally {
            $archive.Dispose()
          }
          $returnedFiles = @(Get-ChildItem -LiteralPath $extractedDirectory -Recurse -File)
          if ($returnedFiles.Count -ne 1 -or $returnedFiles[0].Name -ne $expected) {
            throw "SignPath must return exactly one correctly named Windows executable."
          }
          $signedHash = (Get-FileHash -LiteralPath $returnedFiles[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($signedHash -eq $env:RHO_UNSIGNED_BINARY_SHA256) {
            throw "SignPath returned unchanged Windows executable bytes."
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $returnedFiles[0].FullName
          if ($null -eq $signature.SignerCertificate) {
            throw "Returned Windows executable has no Authenticode signer certificate."
          }
          if ([string]$signature.Status -ne "UnknownError") {
            throw "Free Trial candidate must retain the expected untrusted self-signed status."
          }
          $actualThumbprint = ($signature.SignerCertificate.Thumbprint -replace '[^0-9A-Fa-f]', '').ToUpperInvariant()
          if ($actualThumbprint -ne $env:SIGNPATH_CERTIFICATE_THUMBPRINT) {
            throw "Returned installer signer thumbprint does not match protected configuration."
          }
          if ($signature.SignerCertificate.Subject -ne $signature.SignerCertificate.Issuer) {
            throw "Free Trial signer certificate must be self-signed."
          }
          $releaseBinary = Join-Path $PWD "target\release\$expected"
          Copy-Item -LiteralPath $returnedFiles[0].FullName -Destination $releaseBinary -Force
          $promotedHash = (Get-FileHash -LiteralPath $releaseBinary -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($promotedHash -ne $signedHash) {
            throw "Promoted Windows executable does not match returned signed bytes."
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "RHO_SIGNED_BINARY_SHA256=$signedHash" -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "RHO_BINARY_SIGNATURE_STATUS=$([string]$signature.Status)" -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "RHO_BINARY_SIGNING_REQUEST_ID=$($env:BINARY_SIGNING_REQUEST_ID.ToLowerInvariant())" -Encoding utf8

      - name: Bundle NSIS without rebuilding signed Windows executable
        if: ${{ needs.identity.outputs.build_mode == 'candidate' }}
        shell: pwsh
        env:
          CANDIDATE_VERSION: ${{ needs.identity.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY) -or [string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw "Candidate native updater signing secrets are required for BundleOnly."
          }
          ./scripts/build-windows-installer.ps1 -BuildMode BundleOnly
          $binary = Join-Path $PWD "target\release\rho-desktop.exe"
          $bundledHash = (Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($bundledHash -ne $env:RHO_SIGNED_BINARY_SHA256) {
            throw "Signed Windows executable changed while bundling NSIS."
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $binary
          if ($null -eq $signature.SignerCertificate -or [string]$signature.Status -ne "UnknownError") {
            throw "Signed Windows executable lost its expected Free Trial signature while bundling."
          }
          $actualThumbprint = ($signature.SignerCertificate.Thumbprint -replace '[^0-9A-Fa-f]', '').ToUpperInvariant()
          if ($actualThumbprint -ne $env:SIGNPATH_CERTIFICATE_THUMBPRINT -or $signature.SignerCertificate.Subject -ne $signature.SignerCertificate.Issuer) {
            throw "Signed Windows executable certificate changed while bundling."
          }
          $expected = "Rho_$($env:CANDIDATE_VERSION)_x64-setup.exe"
          $installers = @(Get-ChildItem -LiteralPath "target\release\bundle\nsis" -Filter "*-setup.exe" -File)
          if ($installers.Count -ne 1 -or $installers[0].Name -ne $expected) {
            throw "BundleOnly did not create exactly $expected."
          }
          $staleBundlerSignature = "$($installers[0].FullName).sig"
          if (-not (Test-Path -LiteralPath $staleBundlerSignature -PathType Leaf)) {
            throw "Tauri did not create the provisional updater signature during BundleOnly."
          }
          Remove-Item -LiteralPath $staleBundlerSignature -Force
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "RHO_BINARY_BUNDLED_SHA256=$bundledHash" -Encoding utf8

      - name: Verify signed executable survival and isolate unsigned Windows installer
        if: ${{ needs.identity.outputs.build_mode == 'candidate' }}
        shell: pwsh
        env:
          CANDIDATE_VERSION: ${{ needs.identity.outputs.version }}
        run: |
          $binary = Join-Path $PWD "target\release\rho-desktop.exe"
          $binaryHash = (Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($binaryHash -ne $env:RHO_SIGNED_BINARY_SHA256 -or $binaryHash -ne $env:RHO_BINARY_BUNDLED_SHA256) {
            throw "Signed Windows executable changed while bundling NSIS."
          }
          $binarySignature = Get-AuthenticodeSignature -LiteralPath $binary
          $binaryThumbprint = if ($binarySignature.SignerCertificate) {
            ($binarySignature.SignerCertificate.Thumbprint -replace '[^0-9A-Fa-f]', '').ToUpperInvariant()
          } else { "" }
          if ([string]$binarySignature.Status -ne "UnknownError" -or $binaryThumbprint -ne $env:SIGNPATH_CERTIFICATE_THUMBPRINT) {
            throw "Signed Windows executable signature did not survive NSIS bundling."
          }
          $expected = "Rho_$($env:CANDIDATE_VERSION)_x64-setup.exe"
          $installer = Join-Path $PWD "target\release\bundle\nsis\$expected"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "Expected unsigned Windows installer is missing."
          }
          $installerSignature = Get-AuthenticodeSignature -LiteralPath $installer
          if ([string]$installerSignature.Status -ne "NotSigned" -or $null -ne $installerSignature.SignerCertificate) {
            throw "Windows installer signing input must be exactly unsigned."
          }
          $unsignedHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "RHO_UNSIGNED_INSTALLER_SHA256=$unsignedHash" -Encoding utf8
          New-Item -ItemType Directory -Path "target\signpath-installer-input" -Force | Out-Null
          $isolatedInstaller = Join-Path $PWD "target\signpath-installer-input\$expected"
          Copy-Item -LiteralPath $installer -Destination $isolatedInstaller
          $inputArchive = Join-Path $PWD "target\signpath-installer-input\rho-signpath-installer-input.zip"
          Compress-Archive -LiteralPath $isolatedInstaller -DestinationPath $inputArchive
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($inputArchive)
          try {
            $entries = @($archive.Entries | Where-Object { -not [string]::IsNullOrEmpty($_.Name) })
            if ($entries.Count -ne 1 -or $entries[0].FullName -ne $expected) {
              throw "The SignPath installer input ZIP must contain exactly the candidate installer at its root."
            }
          } finally {
            $archive.Dispose()
          }

      - name: Submit exact Windows installer through official SignPath REST module
        if: ${{ needs.identity.outputs.build_mode == 'candidate' }}
        id: installer-signpath
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          CANDIDATE_VERSION: ${{ needs.identity.outputs.version }}
          CANDIDATE_COMMIT: ${{ needs.identity.outputs.commit }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNPATH_API_TOKEN)) {
            throw "Required SignPath API token is missing."
          }
          $module = Get-Module -ListAvailable -Name SignPath |
            Where-Object { $_.Version.ToString() -eq $env:SIGNPATH_MODULE_VERSION } |
            Select-Object -First 1
          if ($null -eq $module) {
            throw "The verified SignPath module is unavailable."
          }
          $moduleFile = Join-Path $module.ModuleBase "SignPath.psm1"
          $moduleHash = (Get-FileHash -LiteralPath $moduleFile -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($moduleHash -ne $env:SIGNPATH_MODULE_SHA256) {
            throw "The SignPath module changed after verification."
          }
          Import-Module -Name $module.Path -Force -ErrorAction Stop
          $inputArchive = Join-Path $PWD "target\signpath-installer-input\rho-signpath-installer-input.zip"
          $outputDirectory = Join-Path $PWD "target\signpath-installer-output"
          New-Item -ItemType Directory -Path $outputDirectory -Force | Out-Null
          $signedArchive = Join-Path $outputDirectory "rho-signpath-installer-output.zip"
          $signingRequestId = Submit-SigningRequest `
            -InputArtifactPath $inputArchive `
            -ProjectSlug $env:SIGNPATH_PROJECT_SLUG `
            -SigningPolicySlug $env:SIGNPATH_SIGNING_POLICY_SLUG `
            -ArtifactConfigurationSlug $env:SIGNPATH_ARTIFACT_CONFIGURATION_SLUG `
            -WaitForCompletion `
            -OutputArtifactPath $signedArchive `
            -WaitForCompletionTimeoutInSeconds 900 `
            -UploadAndDownloadRequestTimeoutInSeconds 300 `
            -OrganizationId $env:SIGNPATH_ORGANIZATION_ID `
            -ApiToken $env:SIGNPATH_API_TOKEN `
            -Description "Rho installer $env:CANDIDATE_VERSION at $env:CANDIDATE_COMMIT run $env:GITHUB_RUN_ID attempt $env:GITHUB_RUN_ATTEMPT"
          $signingRequestId = ([string]$signingRequestId).ToLowerInvariant()
          if ($signingRequestId -notmatch '^[0-9a-f]{8}-(?:[0-9a-f]{4}-){3}[0-9a-f]{12}$') {
            throw "SignPath did not return an installer signing request identifier."
          }
          if ($signingRequestId -eq $env:RHO_BINARY_SIGNING_REQUEST_ID) {
            throw "Binary and installer SignPath request identifiers must be distinct."
          }
          if (-not (Test-Path -LiteralPath $signedArchive -PathType Leaf)) {
            throw "SignPath did not return the signed installer ZIP."
          }
          Write-Output "installer_signing_request_id=$signingRequestId" >> $env:GITHUB_OUTPUT

      - name: Verify and promote returned test-signed Windows installer
        if: ${{ needs.identity.outputs.build_mode == 'candidate' }}
        shell: pwsh
        env:
          CANDIDATE_VERSION: ${{ needs.identity.outputs.version }}
          INSTALLER_SIGNING_REQUEST_ID: ${{ steps.installer-signpath.outputs.installer_signing_request_id }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:INSTALLER_SIGNING_REQUEST_ID)) {
            throw "SignPath did not return an installer signing request identifier."
          }
          if ($env:INSTALLER_SIGNING_REQUEST_ID -eq $env:RHO_BINARY_SIGNING_REQUEST_ID) {
            throw "Binary and installer SignPath request identifiers must be distinct."
          }
          $expected = "Rho_$($env:CANDIDATE_VERSION)_x64-setup.exe"
          $signedArchive = Join-Path $PWD "target\signpath-installer-output\rho-signpath-installer-output.zip"
          $extractedDirectory = Join-Path $PWD "target\signpath-installer-output\extracted"
          New-Item -ItemType Directory -Path $extractedDirectory -Force | Out-Null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($signedArchive)
          try {
            $entries = @($archive.Entries | Where-Object { -not [string]::IsNullOrEmpty($_.Name) })
            if ($entries.Count -ne 1 -or $entries[0].FullName -ne $expected) {
              throw "The returned SignPath ZIP must contain exactly the candidate installer at its root."
            }
            $returnedInstaller = Join-Path $extractedDirectory $expected
            [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entries[0], $returnedInstaller, $false)
          } finally {
            $archive.Dispose()
          }
          $returnedFiles = @(Get-ChildItem -LiteralPath $extractedDirectory -Recurse -File)
          if ($returnedFiles.Count -ne 1 -or $returnedFiles[0].Name -ne $expected) {
            throw "SignPath must return exactly one correctly named installer."
          }
          $signedHash = (Get-FileHash -LiteralPath $returnedFiles[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($signedHash -eq $env:RHO_UNSIGNED_INSTALLER_SHA256) {
            throw "SignPath returned unchanged installer bytes."
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $returnedFiles[0].FullName
          if ($null -eq $signature.SignerCertificate) {
            throw "Returned installer has no Authenticode signer certificate."
          }
          if ([string]$signature.Status -ne "UnknownError") {
            throw "Free Trial candidate must retain the expected untrusted self-signed status."
          }
          $actualThumbprint = ($signature.SignerCertificate.Thumbprint -replace '[^0-9A-Fa-f]', '').ToUpperInvariant()
          if ($actualThumbprint -ne $env:SIGNPATH_CERTIFICATE_THUMBPRINT) {
            throw "Returned installer signer thumbprint does not match protected configuration."
          }
          if ($signature.SignerCertificate.Subject -ne $signature.SignerCertificate.Issuer) {
            throw "Free Trial signer certificate must be self-signed."
          }
          New-Item -ItemType Directory -Path "target\candidate" -Force | Out-Null
          $candidate = Join-Path $PWD "target\candidate\$expected"
          Copy-Item -LiteralPath $returnedFiles[0].FullName -Destination $candidate -Force
          $promotedHash = (Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($promotedHash -ne $signedHash) {
            throw "Promoted Windows candidate does not match returned signed bytes."
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "RHO_SIGNED_INSTALLER_SHA256=$signedHash" -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "RHO_INSTALLER_SIGNATURE_STATUS=$([string]$signature.Status)" -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "RHO_INSTALLER_SIGNING_REQUEST_ID=$($env:INSTALLER_SIGNING_REQUEST_ID.ToLowerInvariant())" -Encoding utf8

      - name: Sign final Authenticode Windows updater artifact
        if: ${{ needs.identity.outputs.build_mode == 'candidate' }}
        shell: pwsh
        env:
          CANDIDATE_VERSION: ${{ needs.identity.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY) -or [string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw "Candidate native updater signing secrets are required."
          }
          $artifact = Join-Path $PWD "target\candidate\Rho_$($env:CANDIDATE_VERSION)_x64-setup.exe"
          if (-not (Test-Path -LiteralPath $artifact -PathType Leaf)) { throw "Final Authenticode installer is missing." }
          $artifactHash = (Get-FileHash -LiteralPath $artifact -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($artifactHash -ne $env:RHO_SIGNED_INSTALLER_SHA256) { throw "Final installer changed before Tauri updater signing." }
          & npx -y "@tauri-apps/cli@2.11.4" signer sign "$artifact"
          if ($LASTEXITCODE -ne 0) { throw "Tauri updater signing failed for the final Windows installer." }
          if ((Get-FileHash -LiteralPath $artifact -Algorithm SHA256).Hash.ToLowerInvariant() -ne $artifactHash) {
            throw "Tauri updater signing changed the final Windows installer bytes."
          }
          $signature = "$artifact.sig"
          if (-not (Test-Path -LiteralPath $signature -PathType Leaf)) { throw "Final Windows updater signature is missing." }
          $signatureLength = (Get-Item -LiteralPath $signature).Length
          if ($signatureLength -le 0 -or $signatureLength -gt 16384) { throw "Final Windows updater signature is outside its byte budget." }
          & cargo run --locked -p rho-updater-verifier -- --config "desktop/src-tauri/tauri.conf.json" --artifact "$artifact" --signature "$signature"
          if ($LASTEXITCODE -ne 0) { throw "Final Windows updater signature does not verify against the configured public key." }

      - name: Install and verify signed Windows payload
        if: ${{ needs.identity.outputs.build_mode == 'candidate' }}
        shell: pwsh
        env:
          CANDIDATE_VERSION: ${{ needs.identity.outputs.version }}
        run: |
          function ConvertFrom-RhoRegistryPath {
            param([AllowNull()][object]$Value)
            if ($null -eq $Value) { return $null }
            $pathValue = ([string]$Value).Trim()
            $startsQuoted = $pathValue.StartsWith('"')
            $endsQuoted = $pathValue.EndsWith('"')
            if ($startsQuoted -xor $endsQuoted) { throw "Malformed quoted registry path: $pathValue" }
            if ($startsQuoted -and $pathValue.Length -ge 2) {
              $pathValue = $pathValue.Substring(1, $pathValue.Length - 2)
            }
            if (-not $pathValue -or -not [System.IO.Path]::IsPathFullyQualified($pathValue)) {
              throw "Registry path is not fully qualified: $pathValue"
            }
            return $pathValue
          }

          function Get-RhoUninstallEntry {
            $registryPaths = @(
              "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*",
              "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*",
              "HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*"
            )
            Get-ItemProperty -Path $registryPaths -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName -eq "Rho" -or $_.DisplayName -like "Rho *" } |
              Select-Object -First 1
          }

          $installer = Join-Path $PWD "target\candidate\Rho_$($env:CANDIDATE_VERSION)_x64-setup.exe"
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:RHO_SIGNED_INSTALLER_SHA256) {
            throw "Final installer changed before installed-payload verification."
          }
          if (Get-RhoUninstallEntry) {
            throw "Hosted Windows candidate runner is not clean; a Rho installation already exists."
          }
          $installedExecutable = $null
          $uninstaller = $null
          $installedHash = $null
          $installedSignatureStatus = $null
          $installedThumbprint = $null
          $cleanupVerified = $false
          $installationObserved = $false
          try {
            $installerProcess = Start-Process -FilePath $installer -ArgumentList "/S" -PassThru -Wait
            if ($installerProcess.ExitCode -ne 0) { throw "NSIS silent install failed with $($installerProcess.ExitCode)." }
            $entry = Get-RhoUninstallEntry
            if (-not $entry) { throw "The installed Rho registry entry was not found." }
            if ([string]$entry.DisplayVersion -ne $env:CANDIDATE_VERSION) {
              throw "Installed Rho version does not match the exact candidate."
            }
            $installationObserved = $true
            $candidates = [System.Collections.Generic.List[string]]::new()
            $installLocation = ConvertFrom-RhoRegistryPath $entry.InstallLocation
            if ($installLocation) {
              $candidates.Add((Join-Path $installLocation "rho-desktop.exe"))
              $candidates.Add((Join-Path $installLocation "Rho.exe"))
            }
            if ($entry.DisplayIcon) {
              $icon = [regex]::Match([string]$entry.DisplayIcon, '^"?(.+?\.exe)"?(?:,\d+)?$')
              if ($icon.Success) { $candidates.Add($icon.Groups[1].Value) }
            }
            $candidates.Add((Join-Path $env:LOCALAPPDATA "Rho\rho-desktop.exe"))
            $candidates.Add((Join-Path $env:LOCALAPPDATA "Programs\Rho\rho-desktop.exe"))
            $installedExecutable = $candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
            if (-not $installedExecutable) {
              $installedExecutable = Get-ChildItem -LiteralPath $env:LOCALAPPDATA -Filter "rho-desktop.exe" -File -Recurse -Depth 5 -ErrorAction SilentlyContinue |
                Select-Object -ExpandProperty FullName -First 1
            }
            if (-not $installedExecutable) { throw "The installed rho-desktop.exe was not found." }
            $installedExecutable = (Resolve-Path -LiteralPath $installedExecutable).Path
            $workspaceRoot = (Resolve-Path -LiteralPath $env:GITHUB_WORKSPACE).Path
            $separator = [System.IO.Path]::DirectorySeparatorChar
            $workspacePrefix = $workspaceRoot.TrimEnd($separator) + $separator
            if ($installedExecutable.Equals($workspaceRoot, [System.StringComparison]::OrdinalIgnoreCase) -or
                $installedExecutable.StartsWith($workspacePrefix, [System.StringComparison]::OrdinalIgnoreCase)) {
              throw "The installed executable is inside the workspace: $installedExecutable"
            }
            $installedHash = (Get-FileHash -LiteralPath $installedExecutable -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($installedHash -ne $env:RHO_SIGNED_BINARY_SHA256) {
              throw "The installed executable does not match the exact signed Windows executable."
            }
            $installedSignature = Get-AuthenticodeSignature -LiteralPath $installedExecutable
            if ($null -eq $installedSignature.SignerCertificate -or [string]$installedSignature.Status -ne "UnknownError") {
              throw "The installed executable does not retain the expected Free Trial Authenticode signature."
            }
            $installedSignatureStatus = [string]$installedSignature.Status
            $installedThumbprint = ($installedSignature.SignerCertificate.Thumbprint -replace '[^0-9A-Fa-f]', '').ToUpperInvariant()
            if ($installedThumbprint -ne $env:SIGNPATH_CERTIFICATE_THUMBPRINT) {
              throw "The installed executable signer thumbprint does not match protected configuration."
            }
            if ($installedSignature.SignerCertificate.Subject -ne $installedSignature.SignerCertificate.Issuer) {
              throw "The installed executable Free Trial signer certificate must be self-signed."
            }
            $smoke = Start-Process -FilePath $installedExecutable -ArgumentList "--smoke-test" -PassThru -Wait
            if ($smoke.ExitCode -ne 0) { throw "Installed Windows Workspace smoke failed." }
            if ($entry.UninstallString) {
              $uninstallMatch = [regex]::Match([string]$entry.UninstallString, '^"?(.+?\.exe)"?(?:\s.*)?$')
              if ($uninstallMatch.Success) { $uninstaller = $uninstallMatch.Groups[1].Value }
            }
            if (-not $uninstaller -or -not (Test-Path -LiteralPath $uninstaller -PathType Leaf)) {
              $uninstaller = Get-ChildItem -LiteralPath (Split-Path -Parent $installedExecutable) -Filter "uninstall*.exe" -File -ErrorAction SilentlyContinue |
                Select-Object -ExpandProperty FullName -First 1
            }
            if (-not $uninstaller -or -not (Test-Path -LiteralPath $uninstaller -PathType Leaf)) {
              throw "The exact registered Rho uninstaller was not found."
            }
          }
          finally {
            Get-Process -Name "rho-desktop" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            $cleanupEntry = Get-RhoUninstallEntry
            if ($cleanupEntry) { $installationObserved = $true }
            if ((-not $uninstaller -or -not (Test-Path -LiteralPath $uninstaller -PathType Leaf)) -and $cleanupEntry.UninstallString) {
              $cleanupMatch = [regex]::Match([string]$cleanupEntry.UninstallString, '^"?(.+?\.exe)"?(?:\s.*)?$')
              if ($cleanupMatch.Success) { $uninstaller = $cleanupMatch.Groups[1].Value }
            }
            if ($uninstaller -and (Test-Path -LiteralPath $uninstaller -PathType Leaf)) {
              $cleanup = Start-Process -FilePath $uninstaller -ArgumentList "/S" -PassThru -Wait
              if ($cleanup.ExitCode -ne 0) { throw "Installed Rho cleanup failed with $($cleanup.ExitCode)." }
            }
            for ($attempt = 0; $attempt -lt 60; $attempt += 1) {
              $executableRemoved = -not $installedExecutable -or -not (Test-Path -LiteralPath $installedExecutable -PathType Leaf)
              $registryRemoved = -not [bool](Get-RhoUninstallEntry)
              if ($executableRemoved -and $registryRemoved) { $cleanupVerified = $true; break }
              Start-Sleep -Milliseconds 500
            }
            if ($installationObserved -and -not $cleanupVerified) {
              throw "Installed Rho cleanup did not remove executable and registry state."
            }
          }
          if (-not $installationObserved -or -not $cleanupVerified) {
            throw "Installed-payload verification did not complete with cleanup."
          }
          $evidence = [ordered]@{
            schema_version = 2
            provider = "signpath"
            profile = "free_trial_self_signed_two_stage"
            module_version = $env:SIGNPATH_MODULE_VERSION
            module_sha256 = $env:SIGNPATH_MODULE_SHA256.ToLowerInvariant()
            signer_thumbprint = $env:SIGNPATH_CERTIFICATE_THUMBPRINT.ToLowerInvariant()
            self_signed = $true
            binary_request_id = $env:RHO_BINARY_SIGNING_REQUEST_ID.ToLowerInvariant()
            binary_signature_status = $env:RHO_BINARY_SIGNATURE_STATUS
            binary_unsigned_sha256 = $env:RHO_UNSIGNED_BINARY_SHA256.ToLowerInvariant()
            binary_signed_sha256 = $env:RHO_SIGNED_BINARY_SHA256.ToLowerInvariant()
            binary_bundled_sha256 = $env:RHO_BINARY_BUNDLED_SHA256.ToLowerInvariant()
            installer_request_id = $env:RHO_INSTALLER_SIGNING_REQUEST_ID.ToLowerInvariant()
            installer_signature_status = $env:RHO_INSTALLER_SIGNATURE_STATUS
            installer_unsigned_sha256 = $env:RHO_UNSIGNED_INSTALLER_SHA256.ToLowerInvariant()
            installer_signed_sha256 = $env:RHO_SIGNED_INSTALLER_SHA256.ToLowerInvariant()
            installed_binary_sha256 = $installedHash
            installed_signature_status = $installedSignatureStatus
            installed_signer_thumbprint = $installedThumbprint.ToLowerInvariant()
            installed_outside_workspace = $true
            cleanup_verified = $true
          }
          $evidence | ConvertTo-Json -Depth 3 | Set-Content -LiteralPath "target\candidate\windows-signing-evidence.json" -Encoding utf8

      - name: Clear SignPath deployment values before evidence handoff
        if: ${{ always() && needs.identity.outputs.build_mode == 'candidate' }}
        shell: pwsh
        run: |
          @(
            "SIGNPATH_ORGANIZATION_ID",
            "SIGNPATH_PROJECT_SLUG",
            "SIGNPATH_SIGNING_POLICY_SLUG",
            "SIGNPATH_ARTIFACT_CONFIGURATION_SLUG",
            "SIGNPATH_BINARY_ARTIFACT_CONFIGURATION_SLUG",
            "SIGNPATH_CERTIFICATE_THUMBPRINT",
            "SIGNPATH_MODULE_VERSION",
            "SIGNPATH_MODULE_SHA256",
            "RHO_UNSIGNED_BINARY_SHA256",
            "RHO_SIGNED_BINARY_SHA256",
            "RHO_BINARY_BUNDLED_SHA256",
            "RHO_BINARY_SIGNATURE_STATUS",
            "RHO_BINARY_SIGNING_REQUEST_ID",
            "RHO_UNSIGNED_INSTALLER_SHA256",
            "RHO_SIGNED_INSTALLER_SHA256",
            "RHO_INSTALLER_SIGNATURE_STATUS",
            "RHO_INSTALLER_SIGNING_REQUEST_ID"
          ) | ForEach-Object {
            Add-Content -LiteralPath $env:GITHUB_ENV -Value "$_=" -Encoding utf8
          }

      - name: Create Windows platform evidence
        shell: pwsh
        env:
          CANDIDATE_MODE: ${{ needs.identity.outputs.build_mode }}
          CANDIDATE_VERSION: ${{ needs.identity.outputs.version }}
          CANDIDATE_TAG: ${{ needs.identity.outputs.release_tag }}
          CANDIDATE_COMMIT: ${{ needs.identity.outputs.commit }}
        run: |
          $artifact = "target\candidate\Rho_$($env:CANDIDATE_VERSION)_x64-setup.exe"
          $evidence = "target\candidate\rho-$($env:CANDIDATE_VERSION)-windows-x86_64-evidence.json"
          $checks = "release_metadata,rust_workspace,rho_bridge,rho_agent,frontend,workspace_smoke"
          $arguments = @(
            "scripts/candidate-release.mjs",
            "--mode", "platform",
            "--version", $env:CANDIDATE_VERSION,
            "--tag", $env:CANDIDATE_TAG,
            "--commit", $env:CANDIDATE_COMMIT,
            "--platform", "windows_x86_64",
            "--artifact", $artifact,
            "--output", $evidence
          )
          if ($env:CANDIDATE_MODE -eq "candidate") {
            $checks = "$checks,authenticode_binary,authenticode_installer,installed_payload_signature,signpath_binary_request_binding,signpath_installer_request_binding,free_trial_self_signed"
            $arguments += @("--signing", "target\candidate\windows-signing-evidence.json")
          }
          $arguments += @("--checks", $checks)
          & node @arguments
          if ($LASTEXITCODE -ne 0) { throw "Windows platform evidence validation failed." }

      - name: Upload immutable Windows candidate inputs
        uses: actions/upload-artifact@v4
        with:
          name: rho-${{ needs.identity.outputs.version }}-windows-x86-64-${{ github.run_id }}
          path: |
            target/candidate/Rho_${{ needs.identity.outputs.version }}_x64-setup.exe
            target/candidate/Rho_${{ needs.identity.outputs.version }}_x64-setup.exe.sha256
            target/candidate/rho-${{ needs.identity.outputs.version }}-windows-x86_64-evidence.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14

      - name: Upload final Windows native updater signature
        if: ${{ needs.identity.outputs.build_mode == 'candidate' }}
        uses: actions/upload-artifact@v4
        with:
          name: rho-${{ needs.identity.outputs.version }}-windows-updater-${{ github.run_id }}
          path: target/candidate/Rho_${{ needs.identity.outputs.version }}_x64-setup.exe.sig
          if-no-files-found: error
          retention-days: 14

  macos-submit:
    name: Build, sign and submit macOS arm64 DMG
    needs: identity
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out immutable candidate commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.identity.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove runner, Xcode and source identity
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ needs.identity.outputs.commit }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          test -d /Applications/Xcode_26.6.app
          test "$(xcodebuild -version | sed -n '1p')" = "Xcode 26.6"
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up current stable R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install R test dependencies
        shell: bash
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          Rscript -e "if (!requireNamespace('remotes', quietly = TRUE)) install.packages('remotes')"
          Rscript -e "remotes::install_deps('r/rho.bridge', dependencies = TRUE, upgrade = 'never')"
          Rscript -e "remotes::install_deps('r/rho.agent', dependencies = TRUE, upgrade = 'never')"

      - name: Install native Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup set profile minimal
          rustup toolchain install stable-aarch64-apple-darwin --no-self-update
          rustup component add rustfmt --toolchain stable-aarch64-apple-darwin
          export RUSTUP_TOOLCHAIN=stable-aarch64-apple-darwin
          echo "RUSTUP_TOOLCHAIN=$RUSTUP_TOOLCHAIN" >> "$GITHUB_ENV"
          rustc -vV | grep -F 'host: aarch64-apple-darwin'

      - name: Bootstrap pinned macOS Ark runtime
        shell: bash
        run: ./scripts/bootstrap-ark-macos.sh

      - name: Run complete macOS candidate validation
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --workspace --locked --no-fail-fast
          Rscript -e "testthat::test_local('r/rho.bridge', reporter = 'summary')"
          Rscript -e "testthat::test_local('r/rho.agent', reporter = 'summary')"
          node --check desktop/dist/app.js
          for test_script in scripts/test-*.mjs; do node "$test_script"; done

      - name: Import temporary Developer ID credentials
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$APPLE_CERTIFICATE"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$KEYCHAIN_PASSWORD"
          test -n "$APPLE_SIGNING_IDENTITY"
          test -n "$APPLE_API_KEY"
          test -n "$APPLE_API_PRIVATE_KEY"
          certificate_path="$RUNNER_TEMP/rho-developer-id.p12"
          keychain_path="$RUNNER_TEMP/rho-signing.keychain-db"
          api_key_path="$RUNNER_TEMP/rho-notary-api-key.p8"
          printf '%s' "$APPLE_CERTIFICATE" | base64 -D > "$certificate_path"
          printf '%s' "$APPLE_API_PRIVATE_KEY" | base64 -D > "$api_key_path"
          chmod 600 "$certificate_path" "$api_key_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -t agg -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" | grep -F "$APPLE_SIGNING_IDENTITY"
          echo "RHO_SIGNING_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"

      - name: Build, sign and submit final DMG and app archive without waiting
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          CANDIDATE_MODE: ${{ needs.identity.outputs.build_mode }}
          CANDIDATE_VERSION: ${{ needs.identity.outputs.version }}
          CANDIDATE_TAG: ${{ needs.identity.outputs.release_tag }}
          CANDIDATE_COMMIT: ${{ needs.identity.outputs.commit }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ needs.identity.outputs.build_mode == 'candidate' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ needs.identity.outputs.build_mode == 'candidate' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          test -n "$APPLE_SIGNING_IDENTITY"
          test -n "$APPLE_TEAM_ID"
          test -n "$APPLE_API_ISSUER"
          test -n "$APPLE_API_KEY"
          test -f "$APPLE_API_KEY_PATH"
          if [[ "$CANDIDATE_MODE" == "candidate" ]]; then
            test -n "$TAURI_SIGNING_PRIVATE_KEY"
            test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          else
            ephemeral_key="$RUNNER_TEMP/rho-rehearsal-tauri-updater.key"
            npx -y "@tauri-apps/cli@2.11.4" signer generate --ci --write-keys "$ephemeral_key"
            test -s "$ephemeral_key"
            export TAURI_SIGNING_PRIVATE_KEY="$(cat "$ephemeral_key")"
            export TAURI_SIGNING_PRIVATE_KEY_PASSWORD=""
          fi
          (cd desktop/src-tauri && env -u APPLE_API_ISSUER -u APPLE_API_KEY -u APPLE_API_KEY_PATH npx -y "@tauri-apps/cli@2.11.4" build --target aarch64-apple-darwin --bundles app,dmg)
          app_path="target/aarch64-apple-darwin/release/bundle/macos/Rho.app"
          built_dmg="target/aarch64-apple-darwin/release/bundle/dmg/Rho_${CANDIDATE_VERSION}_aarch64.dmg"
          test -d "$app_path"
          test -f "$built_dmg"
          updater_artifacts=()
          while IFS= read -r artifact; do updater_artifacts+=("$artifact"); done < <(find target/aarch64-apple-darwin/release/bundle -type f -name '*.app.tar.gz' -print)
          if [[ ${#updater_artifacts[@]} -ne 1 || ! -f "${updater_artifacts[0]}.sig" ]]; then
            printf '%s\n' "Tauri did not create exactly one signed macOS updater artifact." >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=4 "$app_path"
          verify_rho_license_resources() {
            local app_path="$1"
            local license_path="$app_path/Contents/Resources/licenses/rho/LICENSE.txt"
            local notices_path="$app_path/Contents/Resources/licenses/rho/THIRD-PARTY-NOTICES.md"
            test -f "$license_path"
            test ! -L "$license_path"
            test -f "$notices_path"
            test ! -L "$notices_path"
            cmp -s LICENSE "$license_path"
            cmp -s LICENSES.md "$notices_path"
          }
          verify_rho_license_resources "$app_path"
          require_exact_arm64() {
            local label="$1"
            local binary_path="$2"
            local archs
            if ! archs="$(lipo -archs "$binary_path" 2>&1)"; then
              printf '%s architecture probe failed for %s: %s\n' "$label" "$binary_path" "$archs" >&2
              return 1
            fi
            printf '%s architecture: %s (%s)\n' "$label" "$archs" "$binary_path"
            if [[ "$archs" != "arm64" ]]; then
              printf '%s must be exactly arm64, observed: %s\n' "$label" "$archs" >&2
              return 1
            fi
          }
          require_exact_arm64 "Rho app executable" "$app_path/Contents/MacOS/rho-desktop"
          ark_path="$(find "$app_path/Contents/MacOS" -maxdepth 1 -type f -name 'ark*' -print -quit)"
          test -n "$ark_path"
          require_exact_arm64 "Bundled Ark executable" "$ark_path"
          require_exact_library_validation_entitlement() {
            local label="$1"
            local binary_path="$2"
            local output_stem="$3"
            local plist_path="$RUNNER_TEMP/${output_stem}.plist"
            local json_path="$RUNNER_TEMP/${output_stem}.json"
            codesign -d --entitlements - --xml "$binary_path" > "$plist_path"
            plutil -convert json -o "$json_path" "$plist_path"
            node scripts/validate-macos-entitlements.mjs "$json_path"
            rm -f "$plist_path" "$json_path"
            printf '%s has the exact reviewed macOS entitlement set (%s)\n' "$label" "$binary_path"
          }
          require_exact_library_validation_entitlement "Rho app executable" "$app_path/Contents/MacOS/rho-desktop" "rho-app-entitlements"
          require_exact_library_validation_entitlement "Bundled Ark executable" "$ark_path" "rho-ark-entitlements"
          "$app_path/Contents/MacOS/rho-desktop" --smoke-test
          mkdir -p target/notary
          submitted_dmg="target/notary/Rho_${CANDIDATE_VERSION}_aarch64.dmg"
          submitted_app_archive="target/notary/Rho_${CANDIDATE_VERSION}_aarch64.app.zip"
          pending_record="target/notary/rho-${CANDIDATE_VERSION}-macos-notary-pending.json"
          app_pending_record="target/notary/rho-${CANDIDATE_VERSION}-macos-app-archive-notary-pending.json"
          cp "$built_dmg" "$submitted_dmg"
          ditto -c -k --keepParent "$app_path" "$submitted_app_archive"
          if ! unzip -Z1 "$submitted_app_archive" | awk '$0 == "Rho.app" || $0 ~ /^Rho\.app\// { seen = 1; next } { exit 1 } END { exit seen ? 0 : 1 }'; then
            echo "The submitted app archive must contain only Rho.app at its root." >&2
            exit 1
          fi
          xcrun notarytool submit "$submitted_dmg" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --no-wait --output-format json > "$RUNNER_TEMP/notary-submit-dmg.json"
          node scripts/macos-notary.mjs submission --receipt "$RUNNER_TEMP/notary-submit-dmg.json" --dmg "$submitted_dmg" --repository "$GITHUB_REPOSITORY" --build-mode "$CANDIDATE_MODE" --version "$CANDIDATE_VERSION" --tag "$CANDIDATE_TAG" --commit "$CANDIDATE_COMMIT" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --output "$pending_record"
          xcrun notarytool submit "$submitted_app_archive" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --no-wait --output-format json > "$RUNNER_TEMP/notary-submit-app-archive.json"
          node scripts/macos-notary.mjs submission --receipt "$RUNNER_TEMP/notary-submit-app-archive.json" --artifact "$submitted_app_archive" --artifact-kind app_zip --repository "$GITHUB_REPOSITORY" --build-mode "$CANDIDATE_MODE" --version "$CANDIDATE_VERSION" --tag "$CANDIDATE_TAG" --commit "$CANDIDATE_COMMIT" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --output "$app_pending_record"
          rm -f "$RUNNER_TEMP/notary-submit-dmg.json" "$RUNNER_TEMP/notary-submit-app-archive.json"

      - name: Remove temporary Apple credentials before artifact handoff
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          keychain_path="$RUNNER_TEMP/rho-signing.keychain-db"
          api_key_path="${APPLE_API_KEY_PATH:-$RUNNER_TEMP/rho-notary-api-key.p8}"
          if [[ -e "$keychain_path" ]]; then security delete-keychain "$keychain_path"; fi
          rm -f "$RUNNER_TEMP/rho-developer-id.p12" "$RUNNER_TEMP/notary-submit-dmg.json" "$RUNNER_TEMP/notary-submit-app-archive.json" "$api_key_path"
          {
            echo "RHO_SIGNING_KEYCHAIN="
            echo "APPLE_API_KEY_PATH="
          } >> "$GITHUB_ENV"
          test ! -e "$keychain_path"
          test ! -e "$RUNNER_TEMP/rho-developer-id.p12"
          test ! -e "$api_key_path"

      - name: Upload immutable unstapled notarization inputs
        uses: actions/upload-artifact@v4
        with:
          name: rho-notary-submission-${{ needs.identity.outputs.version }}-${{ github.run_id }}
          path: |
            target/notary/Rho_${{ needs.identity.outputs.version }}_aarch64.dmg
            target/notary/Rho_${{ needs.identity.outputs.version }}_aarch64.app.zip
            target/notary/rho-${{ needs.identity.outputs.version }}-macos-notary-pending.json
            target/notary/rho-${{ needs.identity.outputs.version }}-macos-app-archive-notary-pending.json
          if-no-files-found: error
          retention-days: 14

  macos-notary-wait:
    name: Wait for exact Apple notarization
    needs: [identity, macos-submit]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
    steps:
      - name: Check out immutable notary contract tools
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.identity.outputs.commit }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download immutable notarization submission records
        uses: actions/download-artifact@v5
        with:
          name: rho-notary-submission-${{ needs.identity.outputs.version }}-${{ github.run_id }}
          path: target/notary

      - name: Poll exact notarization submissions and retrieve bounded Apple logs
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          CANDIDATE_MODE: ${{ needs.identity.outputs.build_mode }}
          CANDIDATE_VERSION: ${{ needs.identity.outputs.version }}
          CANDIDATE_TAG: ${{ needs.identity.outputs.release_tag }}
          CANDIDATE_COMMIT: ${{ needs.identity.outputs.commit }}
        run: |
          set -euo pipefail
          test -n "$APPLE_API_ISSUER"
          test -n "$APPLE_API_KEY"
          test -n "$APPLE_API_PRIVATE_KEY"
          mkdir -p target/notary-accepted
          node scripts/macos-notary.mjs wait --pending "target/notary/rho-${CANDIDATE_VERSION}-macos-notary-pending.json" --output "target/notary-accepted/rho-${CANDIDATE_VERSION}-macos-notary-accepted.json" --log-output "target/notary-accepted/rho-${CANDIDATE_VERSION}-macos-notary-log.json" --repository "$GITHUB_REPOSITORY" --build-mode "$CANDIDATE_MODE" --version "$CANDIDATE_VERSION" --tag "$CANDIDATE_TAG" --commit "$CANDIDATE_COMMIT" --run-id "$GITHUB_RUN_ID" --poll-interval-ms 120000 --max-wait-ms 19800000
          node scripts/macos-notary.mjs wait --pending "target/notary/rho-${CANDIDATE_VERSION}-macos-app-archive-notary-pending.json" --output "target/notary-accepted/rho-${CANDIDATE_VERSION}-macos-app-archive-notary-accepted.json" --log-output "target/notary-accepted/rho-${CANDIDATE_VERSION}-macos-app-archive-notary-log.json" --repository "$GITHUB_REPOSITORY" --build-mode "$CANDIDATE_MODE" --version "$CANDIDATE_VERSION" --tag "$CANDIDATE_TAG" --commit "$CANDIDATE_COMMIT" --run-id "$GITHUB_RUN_ID" --poll-interval-ms 120000 --max-wait-ms 19800000

      - name: Upload immutable acceptance and Apple log
        uses: actions/upload-artifact@v4
        with:
          name: rho-notary-acceptance-${{ needs.identity.outputs.version }}-${{ github.run_id }}
          path: |
            target/notary-accepted/rho-${{ needs.identity.outputs.version }}-macos-notary-accepted.json
            target/notary-accepted/rho-${{ needs.identity.outputs.version }}-macos-notary-log.json
            target/notary-accepted/rho-${{ needs.identity.outputs.version }}-macos-app-archive-notary-accepted.json
            target/notary-accepted/rho-${{ needs.identity.outputs.version }}-macos-app-archive-notary-log.json
          if-no-files-found: error
          retention-days: 14

  macos-finalize:
    name: Staple and verify accepted macOS arm64 DMG
    needs: [identity, macos-submit, macos-notary-wait]
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out immutable candidate commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.identity.outputs.commit }}
          persist-credentials: false

      - name: Prove runner, Xcode and source identity
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ needs.identity.outputs.commit }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          test "$(xcodebuild -version | sed -n '1p')" = "Xcode 26.6"
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install native Rust toolchain for updater signature verification
        shell: bash
        run: |
          set -euo pipefail
          rustup set profile minimal
          rustup toolchain install stable-aarch64-apple-darwin --no-self-update
          export RUSTUP_TOOLCHAIN=stable-aarch64-apple-darwin
          echo "RUSTUP_TOOLCHAIN=$RUSTUP_TOOLCHAIN" >> "$GITHUB_ENV"
          rustc -vV | grep -F 'host: aarch64-apple-darwin'

      - name: Set up current stable R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install exact Workspace smoke runtime dependency
        shell: bash
        run: |
          set -euo pipefail
          Rscript -e "imports <- trimws(strsplit(read.dcf('r/rho.bridge/DESCRIPTION')[1, 'Imports'], ',', fixed = TRUE)[[1]]); imports <- sub(' .*', '', imports); non_base <- sort(setdiff(imports, c('methods', 'utils'))); if (!identical(non_base, 'jsonlite')) stop('rho.bridge non-base Imports changed; review the finalizer dependency contract.'); if (!requireNamespace('jsonlite', quietly = TRUE)) install.packages('jsonlite'); stopifnot(requireNamespace('jsonlite', quietly = TRUE))"

      - name: Download immutable DMG submission inputs
        uses: actions/download-artifact@v5
        with:
          name: rho-notary-submission-${{ needs.identity.outputs.version }}-${{ github.run_id }}
          path: target/notary

      - name: Download immutable Apple acceptance inputs
        uses: actions/download-artifact@v5
        with:
          name: rho-notary-acceptance-${{ needs.identity.outputs.version }}-${{ github.run_id }}
          path: target/notary

      - name: Verify, staple, mount, archive and smoke exact accepted macOS artifacts
        shell: bash
        env:
          CANDIDATE_MODE: ${{ needs.identity.outputs.build_mode }}
          CANDIDATE_VERSION: ${{ needs.identity.outputs.version }}
          CANDIDATE_TAG: ${{ needs.identity.outputs.release_tag }}
          CANDIDATE_COMMIT: ${{ needs.identity.outputs.commit }}
        run: |
          set -euo pipefail
          dmg_path="target/notary/Rho_${CANDIDATE_VERSION}_aarch64.dmg"
          app_archive_path="target/notary/Rho_${CANDIDATE_VERSION}_aarch64.app.zip"
          pending_record="target/notary/rho-${CANDIDATE_VERSION}-macos-notary-pending.json"
          accepted_record="target/notary/rho-${CANDIDATE_VERSION}-macos-notary-accepted.json"
          log_record="target/notary/rho-${CANDIDATE_VERSION}-macos-notary-log.json"
          app_pending_record="target/notary/rho-${CANDIDATE_VERSION}-macos-app-archive-notary-pending.json"
          app_accepted_record="target/notary/rho-${CANDIDATE_VERSION}-macos-app-archive-notary-accepted.json"
          app_log_record="target/notary/rho-${CANDIDATE_VERSION}-macos-app-archive-notary-log.json"
          node scripts/macos-notary.mjs verify --pending "$pending_record" --accepted "$accepted_record" --log "$log_record" --dmg "$dmg_path" --repository "$GITHUB_REPOSITORY" --build-mode "$CANDIDATE_MODE" --version "$CANDIDATE_VERSION" --tag "$CANDIDATE_TAG" --commit "$CANDIDATE_COMMIT" --run-id "$GITHUB_RUN_ID"
          node scripts/macos-notary.mjs verify --pending "$app_pending_record" --accepted "$app_accepted_record" --log "$app_log_record" --artifact "$app_archive_path" --artifact-kind app_zip --repository "$GITHUB_REPOSITORY" --build-mode "$CANDIDATE_MODE" --version "$CANDIDATE_VERSION" --tag "$CANDIDATE_TAG" --commit "$CANDIDATE_COMMIT" --run-id "$GITHUB_RUN_ID"
          xcrun stapler staple "$dmg_path"
          xcrun stapler validate "$dmg_path"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg_path"
          mount_point="$RUNNER_TEMP/rho-candidate-dmg"
          mkdir -p "$mount_point"
          mounted=false
          cleanup_mount() {
            if [[ "$mounted" == true ]]; then hdiutil detach "$mount_point" >/dev/null || true; fi
            rmdir "$mount_point" 2>/dev/null || true
          }
          trap cleanup_mount EXIT
          hdiutil attach "$dmg_path" -nobrowse -readonly -mountpoint "$mount_point"
          mounted=true
          app_path="$mount_point/Rho.app"
          test -d "$app_path"
          codesign --verify --deep --strict --verbose=4 "$app_path"
          verify_rho_license_resources() {
            local app_path="$1"
            local license_path="$app_path/Contents/Resources/licenses/rho/LICENSE.txt"
            local notices_path="$app_path/Contents/Resources/licenses/rho/THIRD-PARTY-NOTICES.md"
            test -f "$license_path"
            test ! -L "$license_path"
            test -f "$notices_path"
            test ! -L "$notices_path"
            cmp -s LICENSE "$license_path"
            cmp -s LICENSES.md "$notices_path"
          }
          verify_rho_license_resources "$app_path"
          require_exact_arm64() {
            local label="$1"
            local binary_path="$2"
            local archs
            if ! archs="$(lipo -archs "$binary_path" 2>&1)"; then
              printf '%s architecture probe failed for %s: %s\n' "$label" "$binary_path" "$archs" >&2
              return 1
            fi
            printf '%s architecture: %s (%s)\n' "$label" "$archs" "$binary_path"
            if [[ "$archs" != "arm64" ]]; then
              printf '%s must be exactly arm64, observed: %s\n' "$label" "$archs" >&2
              return 1
            fi
          }
          require_exact_arm64 "Rho app executable" "$app_path/Contents/MacOS/rho-desktop"
          ark_path="$(find "$app_path/Contents/MacOS" -maxdepth 1 -type f -name 'ark*' -print -quit)"
          test -n "$ark_path"
          require_exact_arm64 "Bundled Ark executable" "$ark_path"
          require_exact_library_validation_entitlement() {
            local label="$1"
            local binary_path="$2"
            local output_stem="$3"
            local plist_path="$RUNNER_TEMP/${output_stem}.plist"
            local json_path="$RUNNER_TEMP/${output_stem}.json"
            codesign -d --entitlements - --xml "$binary_path" > "$plist_path"
            plutil -convert json -o "$json_path" "$plist_path"
            node scripts/validate-macos-entitlements.mjs "$json_path"
            rm -f "$plist_path" "$json_path"
            printf '%s has the exact reviewed macOS entitlement set (%s)\n' "$label" "$binary_path"
          }
          require_exact_library_validation_entitlement "Rho app executable" "$app_path/Contents/MacOS/rho-desktop" "rho-final-app-entitlements"
          require_exact_library_validation_entitlement "Bundled Ark executable" "$ark_path" "rho-final-ark-entitlements"
          spctl --assess --type execute --verbose=4 "$app_path"
          "$app_path/Contents/MacOS/rho-desktop" --smoke-test
          hdiutil detach "$mount_point"
          mounted=false
          rmdir "$mount_point"
          trap - EXIT
          updater_extract="$(mktemp -d "$RUNNER_TEMP/rho-updater-app.XXXXXX")"
          cleanup_updater_extract() {
            rm -rf "$updater_extract"
          }
          trap cleanup_updater_extract EXIT
          ditto -x -k "$app_archive_path" "$updater_extract"
          updater_app_path="$updater_extract/Rho.app"
          test -d "$updater_app_path"
          xcrun stapler staple "$updater_app_path"
          xcrun stapler validate "$updater_app_path"
          codesign --verify --deep --strict --verbose=4 "$updater_app_path"
          verify_rho_license_resources "$updater_app_path"
          require_exact_arm64 "Updater Rho app executable" "$updater_app_path/Contents/MacOS/rho-desktop"
          updater_ark_path="$(find "$updater_app_path/Contents/MacOS" -maxdepth 1 -type f -name 'ark*' -print -quit)"
          test -n "$updater_ark_path"
          require_exact_arm64 "Updater bundled Ark executable" "$updater_ark_path"
          require_exact_library_validation_entitlement "Updater Rho app executable" "$updater_app_path/Contents/MacOS/rho-desktop" "rho-updater-app-entitlements"
          require_exact_library_validation_entitlement "Updater bundled Ark executable" "$updater_ark_path" "rho-updater-ark-entitlements"
          spctl --assess --type execute --verbose=4 "$updater_app_path"
          "$updater_app_path/Contents/MacOS/rho-desktop" --smoke-test
          mkdir -p target/candidate
          cp "$dmg_path" "target/candidate/Rho_${CANDIDATE_VERSION}_aarch64.dmg"
          updater_tar="target/candidate/Rho_${CANDIDATE_VERSION}_aarch64.app.tar.gz"
          tar -C "$updater_extract" -czf "$updater_tar" Rho.app
          if ! tar -tzf "$updater_tar" | awk '$0 == "Rho.app" || $0 == "Rho.app/" || $0 ~ /^Rho\.app\// { seen = 1; next } { exit 1 } END { exit seen ? 0 : 1 }'; then
            echo "The final native updater archive must contain only Rho.app at its root." >&2
            exit 1
          fi
          rm -rf "$updater_extract"
          trap - EXIT

      - name: Create final macOS platform evidence
        shell: bash
        env:
          CANDIDATE_VERSION: ${{ needs.identity.outputs.version }}
          CANDIDATE_TAG: ${{ needs.identity.outputs.release_tag }}
          CANDIDATE_COMMIT: ${{ needs.identity.outputs.commit }}
        run: |
          set -euo pipefail
          node scripts/candidate-release.mjs --mode platform --version "$CANDIDATE_VERSION" --tag "$CANDIDATE_TAG" --commit "$CANDIDATE_COMMIT" --platform macos_aarch64 --artifact "target/candidate/Rho_${CANDIDATE_VERSION}_aarch64.dmg" --output "target/candidate/rho-${CANDIDATE_VERSION}-macos-aarch64-evidence.json" --checks release_metadata,rust_workspace,rho_bridge,rho_agent,frontend,workspace_smoke,arm64,codesign,entitlements,notarization,notary_binding,staple,gatekeeper,license_boundary,native_updater_archive

      - name: Sign final notarized macOS updater archive
        if: ${{ needs.identity.outputs.build_mode == 'candidate' }}
        shell: bash
        env:
          CANDIDATE_VERSION: ${{ needs.identity.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          artifact="target/candidate/Rho_${CANDIDATE_VERSION}_aarch64.app.tar.gz"
          test -s "$artifact"
          npx -y "@tauri-apps/cli@2.11.4" signer sign "$artifact"
          test -s "$artifact.sig"
          test "$(wc -c < "$artifact.sig")" -le 16384
          cargo run --locked -p rho-updater-verifier -- --config desktop/src-tauri/tauri.conf.json --artifact "$artifact" --signature "$artifact.sig"

      - name: Upload immutable final macOS candidate inputs
        uses: actions/upload-artifact@v4
        with:
          name: rho-${{ needs.identity.outputs.version }}-macos-arm64-${{ github.run_id }}
          path: |
            target/candidate/Rho_${{ needs.identity.outputs.version }}_aarch64.dmg
            target/candidate/Rho_${{ needs.identity.outputs.version }}_aarch64.dmg.sha256
            target/candidate/rho-${{ needs.identity.outputs.version }}-macos-aarch64-evidence.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14

      - name: Upload final macOS native updater inputs
        if: ${{ needs.identity.outputs.build_mode == 'candidate' }}
        uses: actions/upload-artifact@v4
        with:
          name: rho-${{ needs.identity.outputs.version }}-macos-updater-${{ github.run_id }}
          path: |
            target/candidate/Rho_${{ needs.identity.outputs.version }}_aarch64.app.tar.gz
            target/candidate/Rho_${{ needs.identity.outputs.version }}_aarch64.app.tar.gz.sig
          if-no-files-found: error
          retention-days: 14

  linux-candidate:
    name: Build Linux x86-64 AppImage candidate
    needs: identity
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Check out immutable candidate commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.identity.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file unzip zip libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev squashfs-tools pkg-config

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up R and test dependencies
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"
          use-public-rspm: true

      - name: Install R test dependencies
        shell: bash
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Rscript -e "if (!requireNamespace('remotes', quietly = TRUE)) install.packages('remotes')"
          Rscript -e "remotes::install_deps('r/rho.bridge', dependencies = TRUE, upgrade = 'never')"
          Rscript -e "remotes::install_deps('r/rho.agent', dependencies = TRUE, upgrade = 'never')"

      - name: Install pinned Linux Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup set profile minimal
          rustup toolchain install 1.97.0-x86_64-unknown-linux-gnu --no-self-update
          rustup component add rustfmt --toolchain 1.97.0-x86_64-unknown-linux-gnu
          rustup default 1.97.0
          rustc -vV | grep -Fx 'host: x86_64-unknown-linux-gnu'

      - name: Bootstrap pinned Linux Ark runtime
        shell: bash
        run: scripts/bootstrap-ark-linux.sh

      - name: Prepare Linux runtime resources
        shell: bash
        run: scripts/prepare-runtime-resources.sh

      - name: Run complete Linux candidate validation
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --workspace --locked --no-fail-fast
          Rscript -e "testthat::test_local('r/rho.bridge', reporter = 'summary')"
          Rscript -e "testthat::test_local('r/rho.agent', reporter = 'summary')"
          node --check desktop/dist/app.js
          for test_script in scripts/test-*.mjs; do node "$test_script"; done

      - name: Build AppRun-patched and final-signed Linux AppImage
        id: build
        shell: bash
        env:
          CANDIDATE_MODE: ${{ needs.identity.outputs.build_mode }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ needs.identity.outputs.build_mode == 'candidate' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ needs.identity.outputs.build_mode == 'candidate' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          if [[ "$CANDIDATE_MODE" == "candidate" ]]; then
            test -n "$TAURI_SIGNING_PRIVATE_KEY"
            test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          fi
          scripts/build-linux.sh

      - name: Verify and stage exact Linux candidate
        shell: bash
        env:
          CANDIDATE_MODE: ${{ needs.identity.outputs.build_mode }}
          CANDIDATE_VERSION: ${{ needs.identity.outputs.version }}
          CANDIDATE_TAG: ${{ needs.identity.outputs.release_tag }}
          CANDIDATE_COMMIT: ${{ needs.identity.outputs.commit }}
        run: |
          set -euo pipefail
          artifact="target/release/bundle/appimage/Rho_${CANDIDATE_VERSION}_x86_64.AppImage"
          signature="$artifact.sig"
          test -x "$artifact"
          test -s "$signature"
          if [[ "$CANDIDATE_MODE" == "candidate" ]]; then
            cargo run --locked -p rho-updater-verifier -- --config desktop/src-tauri/tauri.conf.json --artifact "$artifact" --signature "$signature"
          fi
          mkdir -p target/candidate
          cp "$artifact" "target/candidate/$(basename "$artifact")"
          cp "$signature" "target/candidate/$(basename "$signature")"
          node scripts/candidate-release.mjs --mode platform --version "$CANDIDATE_VERSION" --tag "$CANDIDATE_TAG" --commit "$CANDIDATE_COMMIT" --platform linux_x86_64 --artifact "target/candidate/$(basename "$artifact")" --output "target/candidate/rho-${CANDIDATE_VERSION}-linux-x86_64-evidence.json" --checks release_metadata,rust_workspace,rho_bridge,rho_agent,frontend,workspace_smoke,x86_64,appimage,apprun,license_boundary,native_updater_signature

      - name: Upload immutable Linux candidate and updater inputs
        uses: actions/upload-artifact@v4
        with:
          name: rho-${{ needs.identity.outputs.version }}-linux-x86-64-${{ github.run_id }}
          path: |
            target/candidate/Rho_${{ needs.identity.outputs.version }}_x86_64.AppImage
            target/candidate/Rho_${{ needs.identity.outputs.version }}_x86_64.AppImage.sha256
            target/candidate/Rho_${{ needs.identity.outputs.version }}_x86_64.AppImage.sig
            target/candidate/rho-${{ needs.identity.outputs.version }}-linux-x86_64-evidence.json
          if-no-files-found: error
          retention-days: 14

  rehearsal-evidence:
    name: Assemble review-only rehearsal artifact
    if: ${{ needs.identity.outputs.build_mode == 'rehearsal' && github.repository == 'YuLab-SMU/Rho_for_mac' }}
    needs: [identity, windows-candidate, macos-finalize, linux-candidate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out rehearsal contract tools
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.identity.outputs.commit }}
          persist-credentials: false

      - name: Download both platform rehearsal inputs
        uses: actions/download-artifact@v5
        with:
          pattern: rho-${{ needs.identity.outputs.version }}-*-${{ github.run_id }}
          path: target/candidate
          merge-multiple: true

      - name: Validate both platforms and create bounded rehearsal evidence
        shell: bash
        env:
          CANDIDATE_VERSION: ${{ needs.identity.outputs.version }}
          CANDIDATE_TAG: ${{ needs.identity.outputs.release_tag }}
          CANDIDATE_COMMIT: ${{ needs.identity.outputs.commit }}
        run: |
          set -euo pipefail
          candidate_evidence="target/candidate/rho-${CANDIDATE_VERSION}-candidate-evidence.json"
          rehearsal_evidence="target/candidate/rho-${CANDIDATE_VERSION}-rehearsal-evidence.json"
          node scripts/candidate-release.mjs --mode aggregate --version "$CANDIDATE_VERSION" --tag "$CANDIDATE_TAG" --commit "$CANDIDATE_COMMIT" --directory target/candidate --windows_evidence "target/candidate/rho-${CANDIDATE_VERSION}-windows-x86_64-evidence.json" --macos_evidence "target/candidate/rho-${CANDIDATE_VERSION}-macos-aarch64-evidence.json" --linux_evidence "target/candidate/rho-${CANDIDATE_VERSION}-linux-x86_64-evidence.json" --output "$candidate_evidence"
          node scripts/candidate-release.mjs --mode rehearsal --input "$candidate_evidence" --repository "$GITHUB_REPOSITORY" --run_id "$GITHUB_RUN_ID" --run_attempt "$GITHUB_RUN_ATTEMPT" --output "$rehearsal_evidence"
          node -e 'require("node:fs").unlinkSync(process.argv[1])' "$candidate_evidence"

      - name: Upload exact review-only rehearsal artifact
        uses: actions/upload-artifact@v4
        with:
          name: rho-${{ needs.identity.outputs.version }}-rehearsal-${{ needs.identity.outputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/candidate/Rho_${{ needs.identity.outputs.version }}_x64-setup.exe
            target/candidate/Rho_${{ needs.identity.outputs.version }}_x64-setup.exe.sha256
            target/candidate/rho-${{ needs.identity.outputs.version }}-windows-x86_64-evidence.json
            target/candidate/Rho_${{ needs.identity.outputs.version }}_aarch64.dmg
            target/candidate/Rho_${{ needs.identity.outputs.version }}_aarch64.dmg.sha256
            target/candidate/rho-${{ needs.identity.outputs.version }}-macos-aarch64-evidence.json
            target/candidate/Rho_${{ needs.identity.outputs.version }}_x86_64.AppImage
            target/candidate/Rho_${{ needs.identity.outputs.version }}_x86_64.AppImage.sha256
            target/candidate/rho-${{ needs.identity.outputs.version }}-linux-x86_64-evidence.json
            target/candidate/rho-${{ needs.identity.outputs.version }}-rehearsal-evidence.json
          if-no-files-found: error
          retention-days: 14

  draft-candidate:
    name: Assemble immutable draft prerelease
    if: ${{ needs.identity.outputs.build_mode == 'candidate' && github.repository == 'YuLab-SMU/Rho' }}
    needs: [identity, windows-candidate, macos-finalize, linux-candidate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out candidate contract tools
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.identity.outputs.commit }}
          persist-credentials: false

      - name: Download both platform candidates
        uses: actions/download-artifact@v5
        with:
          pattern: rho-${{ needs.identity.outputs.version }}-*-${{ github.run_id }}
          path: target/candidate
          merge-multiple: true

      - name: Validate and aggregate exact candidate assets
        shell: bash
        env:
          CANDIDATE_VERSION: ${{ needs.identity.outputs.version }}
          CANDIDATE_TAG: ${{ needs.identity.outputs.release_tag }}
          CANDIDATE_COMMIT: ${{ needs.identity.outputs.commit }}
        run: |
          set -euo pipefail
          node scripts/candidate-release.mjs --mode aggregate --version "$CANDIDATE_VERSION" --tag "$CANDIDATE_TAG" --commit "$CANDIDATE_COMMIT" --directory target/candidate --windows_evidence "target/candidate/rho-${CANDIDATE_VERSION}-windows-x86_64-evidence.json" --macos_evidence "target/candidate/rho-${CANDIDATE_VERSION}-macos-aarch64-evidence.json" --linux_evidence "target/candidate/rho-${CANDIDATE_VERSION}-linux-x86_64-evidence.json" --output "target/candidate/rho-${CANDIDATE_VERSION}-candidate-evidence.json" --require_windows_signing true
          node scripts/tauri-native-updater.mjs --mode evidence --version "$CANDIDATE_VERSION" --tag "$CANDIDATE_TAG" --commit "$CANDIDATE_COMMIT" --directory target/candidate --output "target/candidate/rho-${CANDIDATE_VERSION}-tauri-native-updater-evidence.json"
          node scripts/candidate-release.mjs --mode automated-acceptance --input "target/candidate/rho-${CANDIDATE_VERSION}-candidate-evidence.json" --output "target/candidate/rho-${CANDIDATE_VERSION}-acceptance.json"

      - name: Prepare reviewed release notes from the exact candidate commit
        shell: bash
        env:
          CANDIDATE_VERSION: ${{ needs.identity.outputs.version }}
          CANDIDATE_TAG: ${{ needs.identity.outputs.release_tag }}
        run: |
          set -euo pipefail
          node scripts/release-notes.mjs --mode prepare --version "$CANDIDATE_VERSION" --tag "$CANDIDATE_TAG" --output target/candidate/release-notes.json

      - name: Create single-use draft and upload assets once
        id: draft
        uses: actions/github-script@v7
        env:
          CANDIDATE_VERSION: ${{ needs.identity.outputs.version }}
          CANDIDATE_TAG: ${{ needs.identity.outputs.release_tag }}
          CANDIDATE_NAME: ${{ needs.identity.outputs.release_name }}
          CANDIDATE_COMMIT: ${{ needs.identity.outputs.commit }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");
            const path = require("path");
            const { pathToFileURL } = require("url");
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            try {
              await github.rest.repos.getReleaseByTag({ owner, repo, tag: process.env.CANDIDATE_TAG });
              throw new Error(`Release ${process.env.CANDIDATE_TAG} already exists; advance the candidate version.`);
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            try {
              await github.rest.git.getRef({ owner, repo, ref: `tags/${process.env.CANDIDATE_TAG}` });
              throw new Error(`Tag ${process.env.CANDIDATE_TAG} already exists; advance the candidate version.`);
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const version = process.env.CANDIDATE_VERSION;
            const releaseNotesModule = await import(pathToFileURL(path.join(process.cwd(), "scripts", "release-notes.mjs")).href);
            const releaseNotes = releaseNotesModule.validateReleaseNotesRecord(
              JSON.parse(fs.readFileSync(path.join("target", "candidate", "release-notes.json"), "utf8")),
              { version, release_tag: process.env.CANDIDATE_TAG },
            );
            const requiredNames = [
              `Rho_${version}_x64-setup.exe`,
              `Rho_${version}_x64-setup.exe.sha256`,
              `rho-${version}-windows-x86_64-evidence.json`,
              `Rho_${version}_aarch64.dmg`,
              `Rho_${version}_aarch64.dmg.sha256`,
              `rho-${version}-macos-aarch64-evidence.json`,
              `Rho_${version}_x86_64.AppImage`,
              `Rho_${version}_x86_64.AppImage.sha256`,
              `rho-${version}-linux-x86_64-evidence.json`,
              `rho-${version}-candidate-evidence.json`,
              `rho-${version}-acceptance.json`,
              `Rho_${version}_x64-setup.exe.sig`,
              `Rho_${version}_aarch64.app.tar.gz`,
              `Rho_${version}_aarch64.app.tar.gz.sig`,
              `Rho_${version}_x86_64.AppImage.sig`,
              `rho-${version}-tauri-native-updater-evidence.json`,
            ];
            const files = requiredNames.map((name) => {
              const filePath = path.join("target", "candidate", name);
              const stat = fs.statSync(filePath);
              if (!stat.isFile() || stat.size <= 0) throw new Error(`Missing candidate asset ${name}`);
              return { name, filePath, size: stat.size };
            });
            const release = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: process.env.CANDIDATE_TAG,
              target_commitish: process.env.CANDIDATE_COMMIT,
              name: process.env.CANDIDATE_NAME,
              body: releaseNotes.body,
              draft: true,
              prerelease: true,
            });
            for (const file of files) {
              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id: release.data.id,
                name: file.name,
                data: fs.readFileSync(file.filePath),
                headers: { "content-type": "application/octet-stream", "content-length": file.size },
              });
            }
            const checked = await github.rest.repos.getRelease({ owner, repo, release_id: release.data.id });
            if (
              !checked.data.draft
              || !checked.data.prerelease
              || checked.data.tag_name !== process.env.CANDIDATE_TAG
              || checked.data.target_commitish !== process.env.CANDIDATE_COMMIT
              || checked.data.name !== process.env.CANDIDATE_NAME
              || checked.data.body !== releaseNotes.body
            ) {
              throw new Error("Draft release identity changed during assembly.");
            }
            const actual = new Map(checked.data.assets.map((asset) => [asset.name, asset.size]));
            if (actual.size !== files.length || files.some((file) => actual.get(file.name) !== file.size)) {
              throw new Error("Draft release assets do not match the aggregate candidate.");
            }
            core.setOutput("release_url", checked.data.html_url);

      - name: Report unpublished draft
        shell: bash
        env:
          DRAFT_URL: ${{ steps.draft.outputs.release_url }}
        run: echo "Candidate remains an unpublished draft at $DRAFT_URL"

name: Windows Manual Publish

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Current upstream default-branch ref to build and release
        required: true
        default: main
      release_tag:
        description: New GitHub release tag, for example v0.2.0-dev.11
        required: true
      release_name:
        description: GitHub release title
        required: true
      prerelease:
        description: Mark the published release as a prerelease
        required: true
        type: boolean
        default: true
      run_smoke_test:
        description: Run rho-desktop.exe --smoke-test before publishing
        required: true
        type: boolean
        default: true
      run_agent_smoke_test:
        description: Run the configured network-dependent Agent smoke test
        required: true
        type: boolean
        default: false

permissions:
  actions: read
  contents: write

concurrency:
  group: windows-manual-publish-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish-windows:
    name: Build and publish Windows installer
    runs-on: windows-latest
    if: github.repository == 'YuLab-SMU/Rho'

    steps:
      - name: Check out target ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record checked-out build identity
        shell: pwsh
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          $commit = (& git rev-parse HEAD).Trim()
          if (-not $commit) {
            throw "Could not resolve the checked-out build commit."
          }
          $defaultCommit = (& git rev-parse "origin/$env:DEFAULT_BRANCH").Trim()
          if ($commit -ne $defaultCommit) {
            throw "Manual release must use current upstream default-branch head $defaultCommit, received $commit."
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "RHO_BUILD_COMMIT=$commit"

      - name: Configure hosted toolchain environment
        shell: pwsh
        run: |
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "CARGO_HOME=$env:USERPROFILE\.cargo"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "RUSTUP_HOME=$env:USERPROFILE\.rustup"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "RTOOLS_BIN=C:\rtools45\x86_64-w64-mingw32.static.posix\bin"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "RUSTUP_TOOLCHAIN=stable-x86_64-pc-windows-gnu"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"
          rtools-version: "45"
          use-public-rspm: true

      - name: Resolve Rscript path
        shell: pwsh
        run: |
          $rscript = (& Rscript -e "cat(normalizePath(file.path(R.home('bin'), 'Rscript.exe'), winslash='/', mustWork=TRUE))").Trim()
          if (-not $rscript) {
              throw "Could not resolve the hosted Rscript.exe path."
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "RHO_RSCRIPT=$rscript"

      - name: Install R package test and smoke dependencies
        shell: pwsh
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Rscript -e "if (!requireNamespace('remotes', quietly = TRUE)) install.packages('remotes')"
          Rscript -e "remotes::install_deps('r/rho.bridge', dependencies = TRUE, upgrade = 'never')"
          Rscript -e "remotes::install_deps('r/rho.agent', dependencies = TRUE, upgrade = 'never')"
          Rscript -e "stopifnot(requireNamespace('jsonlite', quietly = TRUE), requireNamespace('testthat', quietly = TRUE), requireNamespace('aisdk', quietly = TRUE))"

      - name: Install GNU Rust toolchain
        shell: bash
        run: |
          rustup set profile minimal
          rustup toolchain install stable-x86_64-pc-windows-gnu --no-self-update
          rustup component add rustfmt --toolchain stable-x86_64-pc-windows-gnu
          rustup default stable-x86_64-pc-windows-gnu
          rustc -vV
          cargo -vV
          cargo fmt --version

      - name: Verify hosted build environment
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath $env:RTOOLS_BIN)) {
              throw "Expected Rtools bin directory was not found at $env:RTOOLS_BIN."
          }
          Rscript -e "cat(R.version.string)"
          Write-Host ""
          Write-Host "RHO_RSCRIPT=$env:RHO_RSCRIPT"
          & "$env:RTOOLS_BIN\gcc.exe" --version
          rustup show active-toolchain

      - name: Bootstrap Ark runtime
        shell: pwsh
        run: ./scripts/bootstrap-ark-windows.ps1 -RscriptPath "$env:RHO_RSCRIPT"

      - name: Enforce final-release smoke requirements
        shell: pwsh
        run: |
          $isPrerelease = [System.Convert]::ToBoolean("${{ inputs.prerelease }}")
          $runWorkspaceSmoke = [System.Convert]::ToBoolean("${{ inputs.run_smoke_test }}")
          $runAgentSmoke = [System.Convert]::ToBoolean("${{ inputs.run_agent_smoke_test }}")
          if (-not $isPrerelease -and (-not $runWorkspaceSmoke -or -not $runAgentSmoke)) {
            throw "Final releases require both Workspace and Agent smoke tests."
          }

      - name: Verify source, build unsigned installer and run release smoke tests
        id: pre_sign_checks
        shell: pwsh
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          $runAgentSmoke = [System.Convert]::ToBoolean("${{ inputs.run_agent_smoke_test }}")
          if ($runAgentSmoke -and -not $env:DEEPSEEK_API_KEY) {
            throw "Agent smoke was requested, but the DEEPSEEK_API_KEY repository secret is unavailable."
          }
          $parameters = @{
            ReleaseTag = "${{ inputs.release_tag }}"
            Prerelease = "${{ inputs.prerelease }}"
            EvidencePath = "target\release-evidence\rho-0.2-release.json"
            RequireCleanWorktree = $true
            BuildInstaller = $true
            SkipEvidence = $true
            SmokeWorkspace = [System.Convert]::ToBoolean("${{ inputs.run_smoke_test }}")
            SmokeAgent = $runAgentSmoke
          }
          ./scripts/invoke-0.2-release-checks.ps1 @parameters

      - name: Upload unsigned Windows installer for SignPath
        id: upload_unsigned_installer
        uses: actions/upload-artifact@v4
        with:
          name: signpath-unsigned-rho-manual-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.pre_sign_checks.outputs.installer_path }}
          if-no-files-found: error
          retention-days: 1

      - name: Sign Windows installer with the configured SignPath trial policy
        id: signpath
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: 0b1b9db7-5b44-46d3-abff-faaae8ad587e
          project-slug: rho
          signing-policy-slug: test-signing
          artifact-configuration-slug: github-actions-nsis-installer
          github-artifact-id: ${{ steps.upload_unsigned_installer.outputs.artifact-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: target/signpath-signed

      - name: Stage exactly one returned self-signed installer
        id: stage_signed_installer
        shell: pwsh
        run: |
          $expected = [System.IO.Path]::GetFileName("${{ steps.pre_sign_checks.outputs.installer_path }}")
          $matches = @(Get-ChildItem -LiteralPath "target\signpath-signed" -Recurse -File -Filter $expected)
          if ($matches.Count -ne 1) { throw "Expected exactly one SignPath-returned $expected, found $($matches.Count)." }
          $signature = Get-AuthenticodeSignature -LiteralPath $matches[0].FullName
          if (-not $signature.SignerCertificate -or $signature.Status -eq [System.Management.Automation.SignatureStatus]::NotSigned) {
            throw "SignPath result is missing an Authenticode signer certificate."
          }
          $thumbprint = $signature.SignerCertificate.Thumbprint.Replace(" ", "").ToUpperInvariant()
          if ($thumbprint -ne "74C895CBF9759AE1041A61F54F3B3BC6B0446511") {
            throw "SignPath result signer does not match the configured Rho Test Signing certificate."
          }
          $staging = Join-Path $PWD "target\signpath-final"
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          $staged = Join-Path $staging $expected
          Copy-Item -LiteralPath $matches[0].FullName -Destination $staged -Force
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "installer_path=$staged"
          $summary = @(
            "## Windows SignPath trial signature",
            "",
            "- Artifact: $expected",
            "- Certificate subject: $($signature.SignerCertificate.Subject)",
            "- Certificate thumbprint: $thumbprint",
            "- Authenticode status: $($signature.Status)",
            "- Trust note: self-signed Rho Test Signing; this status is not a public Windows or SmartScreen trust claim."
          ) -join [Environment]::NewLine
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $summary

      - name: Record release evidence from the returned signed installer
        id: release_checks
        shell: pwsh
        run: |
          $parameters = @{
            ReleaseTag = "${{ inputs.release_tag }}"
            Prerelease = "${{ inputs.prerelease }}"
            EvidencePath = "target\release-evidence\rho-0.2-release.json"
            RequireCleanWorktree = $true
            InstallerPath = "${{ steps.stage_signed_installer.outputs.installer_path }}"
            RequireAuthenticodeSignature = $true
          }
          ./scripts/invoke-0.2-release-checks.ps1 @parameters

      - name: Create GitHub release
        id: release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_NAME: ${{ inputs.release_name }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_TARGET: ${{ steps.release_checks.outputs.commit_sha }}
          INSTALLER_NAME: ${{ steps.release_checks.outputs.installer_name }}
          INSTALLER_SHA256: ${{ steps.release_checks.outputs.hash_value }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prerelease = String(process.env.RELEASE_PRERELEASE).toLowerCase() === "true";
            const body = [
              "GitHub-hosted windows-latest release build.",
              "",
              `- Ref: \`${{ inputs.ref }}\``,
              `- Commit: \`${process.env.RELEASE_TARGET}\``,
              `- Installer: \`${process.env.INSTALLER_NAME}\``,
              `- SHA-256: \`${process.env.INSTALLER_SHA256}\``,
            ].join("\n");
            let existingRelease;
            try {
              existingRelease = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: process.env.RELEASE_TAG,
              });
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }
            if (existingRelease) {
              throw new Error(`Release tag ${process.env.RELEASE_TAG} already exists; release assets are immutable.`);
            }
            const release = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: process.env.RELEASE_TAG,
              target_commitish: process.env.RELEASE_TARGET,
              name: process.env.RELEASE_NAME,
              body,
              draft: false,
              prerelease,
            });
            core.setOutput("release_id", String(release.data.id));

      - name: Upload release assets
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
          INSTALLER_PATH: ${{ steps.release_checks.outputs.installer_path }}
          HASH_PATH: ${{ steps.release_checks.outputs.hash_path }}
          EVIDENCE_PATH: ${{ github.workspace }}\target\release-evidence\rho-0.2-release.json
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");
            const path = require("path");
            const releaseId = Number(process.env.RELEASE_ID);
            const assets = [process.env.INSTALLER_PATH, process.env.HASH_PATH, process.env.EVIDENCE_PATH];
            for (const assetPath of assets) {
              const assetName = path.basename(assetPath);
              const stat = fs.statSync(assetPath);
              const data = fs.readFileSync(assetPath);
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: releaseId,
                name: assetName,
                data,
                headers: {
                  "content-type": "application/octet-stream",
                  "content-length": stat.size,
                },
              });
            }

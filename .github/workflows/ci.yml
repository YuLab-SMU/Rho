# Builds the four Cores from the Core commit Rho selects (components.json), tests Rho on macOS,
# Linux and Windows, checks the selected Plugins' figure describers there with the R and Python
# packages they describe, packs one candidate for every platform and installs it offline on each.
# A v* tag publishes that candidate without building it again (release.yml).
name: CI

# Documentation alone does not run CI, except the pages the package ships and the Status and
# ledger a test reads. The setup page and the Agent Skill are documentation too. A tag never runs this directly; release.yml calls it when needed.
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '.github/**'
      - '!docs/**'
      - 'docs/STATUS.md'
      - 'docs/VERIFICATION.json'
      - 'docs/HEADLESS.md'
      - 'docs/COLLABORATION.md'
      - 'docs/FRONTEND.md'
      - 'docs/PLUGIN-AUTHORING.md'
      - '!AGENTS.md'
      - '!CONTRIBUTING.md'
      - '!PRIVACY.md'
      - '!SECURITY.md'
      - '!CODE_SIGNING_POLICY.md'
      - '!SETUP.md'
      - '!skills/**'
  pull_request:
    paths:
      - '**'
      - '.github/**'
      - '!docs/**'
      - 'docs/STATUS.md'
      - 'docs/VERIFICATION.json'
      - 'docs/HEADLESS.md'
      - 'docs/COLLABORATION.md'
      - 'docs/FRONTEND.md'
      - 'docs/PLUGIN-AUTHORING.md'
      - '!AGENTS.md'
      - '!CONTRIBUTING.md'
      - '!PRIVACY.md'
      - '!SECURITY.md'
      - '!CODE_SIGNING_POLICY.md'
      - '!SETUP.md'
      - '!skills/**'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: '22'

jobs:
  core:
    name: Core ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: darwin-arm64, os: macos-15, target: aarch64-apple-darwin, exe: rho-core }
          - { platform: linux-x64, os: ubuntu-24.04, target: x86_64-unknown-linux-musl, exe: rho-core }
          - { platform: linux-arm64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, exe: rho-core }
          - { platform: win32-x64, os: windows-2022, target: x86_64-pc-windows-msvc, exe: rho-core.exe }
    env:
      # The dev profile without debug info, as the Cores were built and tested for 0.5.1 and 0.5.2.
      CARGO_PROFILE_DEV_DEBUG: '0'
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { path: Rho, sparse-checkout: components.json, sparse-checkout-cone-mode: false, persist-credentials: false }
      - id: pins
        run: node -e 'const c=require("./Rho/components.json");console.log("core="+c.core.commit)' >> "$GITHUB_OUTPUT"
      # A Core commit is built once and reused while Rho selects it. The key names the commit and
      # the build settings; the composition records each Core's digest either way.
      - id: built
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: { path: core-bin, key: 'core-${{ matrix.target }}-${{ steps.pins.outputs.core }}-dev-nodebug' }
      - if: steps.built.outputs.cache-hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { repository: YuLab-SMU/Rho-core, ref: '${{ steps.pins.outputs.core }}', path: Rho-core, persist-credentials: false }
      - if: steps.built.outputs.cache-hit != 'true' && runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools
      - name: Build
        if: steps.built.outputs.cache-hit != 'true'
        working-directory: Rho-core
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
          rustc --version && cargo --version
          cargo build --locked --target ${{ matrix.target }}
          mkdir -p ../core-bin && cp target/${{ matrix.target }}/debug/${{ matrix.exe }} ../core-bin/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: 'core-${{ matrix.platform }}', path: 'core-bin/${{ matrix.exe }}', if-no-files-found: error }

  docs:
    name: Documentation site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { path: Rho, persist-credentials: false }
      - id: pins
        run: node -e 'const c=require("./Rho/components.json");console.log("plugins="+c.plugins.commit)' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { repository: YuLab-SMU/Rho-plugins, ref: '${{ steps.pins.outputs.plugins }}', path: Rho-plugins, persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '${{ env.NODE_VERSION }}', package-manager-cache: false }
      # The site is assembled from docs/ and fails when a document is neither
      # published nor withheld; the build fails on a dead link.
      - name: Build the documentation site
        working-directory: Rho
        run: |
          npm ci --no-audit --no-fund
          npm run docs:build
          npm run docs:check

  test:
    name: Test ${{ matrix.platform }}
    needs: core
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: darwin-arm64, os: macos-15, exe: rho-core }
          - { platform: linux-x64, os: ubuntu-24.04, exe: rho-core }
          - { platform: win32-x64, os: windows-2022, exe: rho-core.exe }
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { path: Rho, persist-credentials: false }
      - id: pins
        run: node -e 'const c=require("./Rho/components.json");console.log("plugins="+c.plugins.commit)' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { repository: YuLab-SMU/Rho-plugins, ref: '${{ steps.pins.outputs.plugins }}', path: Rho-plugins, persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '${{ env.NODE_VERSION }}', package-manager-cache: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.13' }
      # The suite's R scripts use base R of 4.5 and later (tools::sha256sum); Ubuntu's own R is 4.3.
      # Rho compiles no R packages. Rtools on PATH would also make its MSYS bash every step's shell.
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with: { r-version: release, windows-path-include-rtools: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: 'core-${{ matrix.platform }}', path: '${{ runner.temp }}/core' }
      - run: chmod +x "$RUNNER_TEMP/core/${{ matrix.exe }}"
      - name: Build the Plugins
        working-directory: Rho-plugins
        run: npm ci --no-audit --no-fund && npm run build
      - name: Test Rho
        working-directory: Rho
        env:
          RHO_CORE_BINARY: '${{ runner.temp }}/core/${{ matrix.exe }}'
        run: |
          node --version && Rscript --version && python --version
          npm ci --no-audit --no-fund
          # Generated contracts and type checks are the same on every system; Linux runs them.
          if [ "$RUNNER_OS" = Linux ]; then npm run check:contracts; fi
          npm test
      # What Rho's R dependency probe sees when the suite fails, and on Windows again with Rtools' MSYS
      # tools first on PATH, where every R run was once refused.
      - name: Show the R dependency probe
        if: failure()
        run: |
          probe() {
          node --input-type=module - <<'EOF'
          import { spawnSync } from 'node:child_process';
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';
          const load = file => import(pathToFileURL(path.resolve(file)).href);
          const { runtime } = await load('Rho/dist/runtime.js');
          const { checkRequirements, libraryPrefix } = await load('Rho-plugins/plugins/requirements/dist/index.js');
          const { rscript } = await runtime();
          console.log('Rscript selected by Rho:', rscript, JSON.stringify({ HOME: process.env.HOME, R_USER: process.env.R_USER, TMP: process.env.TMP, TEMP: process.env.TEMP }));
          console.log('checkRequirements:', JSON.stringify((await checkRequirements(process.cwd(), [], rscript)).native));
          const code = libraryPrefix({ libraryPaths: [path.join(process.cwd(), '.rho/plugins/R-library')] }) + 'cat("R\\t", R.version.string, "\\n", sep="")\npkgs <- c()\n';
          for (const args of [['--vanilla', '-e', 'cat("R\\t", R.version.string, "\\n", sep="")'], ['--vanilla', '-e', code]]) {
            const p = spawnSync(rscript, args, { encoding: 'utf8' });
            console.log(JSON.stringify({ expression: args[2], status: p.status, error: p.error?.message, stdout: p.stdout, stderr: p.stderr?.slice(-2000) }));
          }
          EOF
          }
          probe
          if [ "$RUNNER_OS" = Windows ] && [ -d /c/rtools45/usr/bin ]; then echo '--- with Rtools first on PATH'; PATH="/c/rtools45/usr/bin:$PATH" probe; fi

  # The figure describers of the selected Plugins, in live R and Python sessions with the packages
  # whose plots they describe. A check skipped for a missing package has not passed.
  describers:
    name: Figure describers ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: darwin-arm64, os: macos-15 }
          - { platform: linux-x64, os: ubuntu-24.04 }
          - { platform: win32-x64, os: windows-2022 }
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { path: Rho, persist-credentials: false }
      - id: pins
        run: node -e 'const c=require("./Rho/components.json");console.log("plugins="+c.plugins.commit)' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { repository: YuLab-SMU/Rho-plugins, ref: '${{ steps.pins.outputs.plugins }}', path: Rho-plugins, persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '${{ env.NODE_VERSION }}', package-manager-cache: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.13' }
      # R's cairo devices (svg(), cairo_pdf()) load XQuartz's libraries on macOS; without them svg()
      # warns "failed to load cairo DLL" and opens no device.
      - if: runner.os == 'macOS'
        run: brew install --cask xquartz
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with: { r-version: release, use-public-rspm: true, windows-path-include-rtools: false }
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          dependencies: '"hard"'
          packages: |
            any::ggplot2
            any::svglite
            any::xml2
            any::jsonlite
            any::patchwork
            any::gridGraphics
            bioc::ComplexHeatmap
      - run: python -m pip install --disable-pip-version-check matplotlib numpy pandas scipy seaborn
      - name: Build the Plugins
        working-directory: Rho-plugins
        run: npm ci --no-audit --no-fund && npm run build
      - name: Check the figure describers
        working-directory: Rho-plugins
        env: { RHO_PYTHON: python }
        run: |
          Rscript -e 'cat(R.version.string, "\n"); for (p in c("ggplot2","svglite","gridGraphics","ComplexHeatmap")) cat(p, format(packageVersion(p)), "\n")'
          python -c 'import matplotlib, pandas, seaborn; print("matplotlib", matplotlib.__version__, "pandas", pandas.__version__, "seaborn", seaborn.__version__)'
          node --test --test-reporter=tap --test-timeout=300000 test/figures.test.mjs | tee "$RUNNER_TEMP/figures.tap"
          grep -q '^# skipped 0$' "$RUNNER_TEMP/figures.tap"

  pack:
    name: Pack the candidate
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { path: Rho, persist-credentials: false }
      - id: pins
        run: node -e 'const c=require("./Rho/components.json");console.log("core="+c.core.commit);console.log("plugins="+c.plugins.commit)' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { repository: YuLab-SMU/Rho-plugins, ref: '${{ steps.pins.outputs.plugins }}', path: Rho-plugins, persist-credentials: false }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { repository: YuLab-SMU/Rho-core, ref: '${{ steps.pins.outputs.core }}', path: Rho-core, persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '${{ env.NODE_VERSION }}', package-manager-cache: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: 'core-*', path: '${{ runner.temp }}/cores' }
      - name: Build the Plugins
        working-directory: Rho-plugins
        run: npm ci --no-audit --no-fund && npm run build
      - name: Pack
        working-directory: Rho
        run: |
          npm ci --no-audit --no-fund
          C="$RUNNER_TEMP/cores"
          node scripts/pack-local.mjs \
            --core darwin-arm64="$C/core-darwin-arm64/rho-core" --core linux-arm64="$C/core-linux-arm64/rho-core" \
            --core linux-x64="$C/core-linux-x64/rho-core" --core win32-x64="$C/core-win32-x64/rho-core.exe" \
            --core-source ../Rho-core --plugins ../Rho-plugins --destination "$RUNNER_TEMP/candidate"
      - name: Check the composition
        run: |
          node - "$RUNNER_TEMP/candidate/composition.json" <<'EOF'
          const c = JSON.parse(require('fs').readFileSync(process.argv[2], 'utf8')), assert = require('assert/strict');
          assert.deepEqual(c.platforms, ['darwin-arm64', 'linux-arm64', 'linux-x64', 'win32-x64']);
          for (const p of ['linux-arm64', 'linux-x64']) assert.equal(c.core.artifacts[p].linkage, 'static', p);
          for (const owner of ['application', 'plugins', 'core']) assert.equal(c[owner].localOverride, null, owner);
          assert.equal(c.application.commit, process.env.GITHUB_SHA);
          console.log(c.artifact.filename, c.artifact.bytes, 'bytes', c.artifact.sha256);
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/candidate/*.tgz
            ${{ runner.temp }}/candidate/composition.json
            ${{ runner.temp }}/candidate/SHA256SUMS

  # The four platforms on Node 22, and Linux x64 again on each later LTS line the engine range
  # admits, so a person whose Node is 24 or 26 installs a candidate that was installed there.
  install:
    name: Install ${{ matrix.report }}
    needs: pack
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: darwin-arm64, os: macos-15, report: darwin-arm64 }
          - { platform: linux-x64, os: ubuntu-24.04, report: linux-x64 }
          - { platform: linux-arm64, os: ubuntu-24.04-arm, report: linux-arm64 }
          - { platform: win32-x64, os: windows-2022, report: win32-x64 }
          - { platform: linux-x64, os: ubuntu-24.04, report: linux-x64-node24, node: '24' }
          - { platform: linux-x64, os: ubuntu-24.04, report: linux-x64-node26, node: '26' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { path: Rho, sparse-checkout: "components.json\nscripts/ci-install-check.mjs", sparse-checkout-cone-mode: false, persist-credentials: false }
      - id: pins
        run: node -e 'const c=require("./Rho/components.json");console.log("plugins="+c.plugins.commit)' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { repository: YuLab-SMU/Rho-plugins, ref: '${{ steps.pins.outputs.plugins }}', path: Rho-plugins, sparse-checkout: examples/ordinary-r-project, persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '${{ matrix.node || env.NODE_VERSION }}', package-manager-cache: false }
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q r-base-core
      - if: runner.os != 'Linux'
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with: { r-version: release, windows-path-include-rtools: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: candidate, path: '${{ runner.temp }}/candidate' }
      - name: Install and run the candidate
        run: node Rho/scripts/ci-install-check.mjs "$RUNNER_TEMP/candidate" Rho-plugins/examples/ordinary-r-project "install-${{ matrix.report }}.json"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: 'install-${{ matrix.report }}', path: 'install-${{ matrix.report }}.json', if-no-files-found: warn }

name: Publish Rho Candidate

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact accepted draft tag
        required: true
        default: v0.4.0-dev.27

permissions:
  contents: read

concurrency:
  group: rho-candidate-publish-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish-candidate:
    name: Validate MAC5 GO and publish existing draft
    runs-on: ubuntu-latest
    environment: rho-release
    permissions:
      contents: write
    steps:
      - name: Resolve immutable draft identity
        id: identity
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const matches = (await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100,
            })).filter((release) => release.tag_name === process.env.RELEASE_TAG);
            if (matches.length !== 1) {
              throw new Error("Publish admission requires exactly one Release matching the requested tag.");
            }
            const release = matches[0];
            if (!release.draft || !release.prerelease || !/^[0-9a-f]{40}$/.test(release.target_commitish)) {
              throw new Error("Publish admission requires a draft prerelease bound to a full commit SHA.");
            }
            core.setOutput("release_id", String(release.id));
            core.setOutput("commit", release.target_commitish);

      - name: Check out the exact draft contract
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.identity.outputs.commit }}
          fetch-depth: 0

      - name: Download draft assets and assemble publish record
        id: draft
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_ID: ${{ steps.identity.outputs.release_id }}
          EXPECTED_COMMIT: ${{ steps.identity.outputs.commit }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const crypto = require("crypto");
            const fs = require("fs");
            const path = require("path");
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const releaseId = Number(process.env.RELEASE_ID);
            if (!Number.isSafeInteger(releaseId) || releaseId <= 0) throw new Error("Resolved draft Release ID is invalid.");
            const release = await github.rest.repos.getRelease({ owner, repo, release_id: releaseId });
            if (release.data.tag_name !== process.env.RELEASE_TAG) throw new Error("Draft tag changed before admission validation.");
            if (!release.data.draft || !release.data.prerelease) throw new Error("Only a draft prerelease may enter publish admission.");
            if (release.data.target_commitish !== process.env.EXPECTED_COMMIT) throw new Error("Draft commit changed before admission validation.");
            const version = process.env.RELEASE_TAG.replace(/^v/, "");
            const candidateName = `rho-${version}-candidate-evidence.json`;
            const acceptanceName = `rho-${version}-acceptance.json`;
            const required = new Set([
              `Rho_${version}_x64-setup.exe`,
              `Rho_${version}_x64-setup.exe.sha256`,
              `rho-${version}-windows-x86_64-evidence.json`,
              `Rho_${version}_aarch64.dmg`,
              `Rho_${version}_aarch64.dmg.sha256`,
              `rho-${version}-macos-aarch64-evidence.json`,
              candidateName,
              acceptanceName,
            ]);
            if (release.data.assets.length !== required.size || release.data.assets.some((asset) => !required.has(asset.name))) {
              throw new Error("Draft release does not contain the exact publish asset set.");
            }
            for (const boundedName of [candidateName, acceptanceName]) {
              const asset = release.data.assets.find((item) => item.name === boundedName);
              if (!asset || asset.size <= 0 || asset.size > 256 * 1024) throw new Error(`${boundedName} exceeds the evidence byte budget.`);
            }
            fs.mkdirSync("target/publish", { recursive: true });
            const downloadedAssets = [];
            for (const asset of release.data.assets) {
              const response = await github.request("GET /repos/{owner}/{repo}/releases/assets/{asset_id}", {
                owner,
                repo,
                asset_id: asset.id,
                headers: { accept: "application/octet-stream" },
              });
              const data = Buffer.from(response.data);
              if (data.length !== asset.size) throw new Error(`Downloaded size mismatch for ${asset.name}`);
              fs.writeFileSync(path.join("target", "publish", asset.name), data);
              downloadedAssets.push({
                name: asset.name,
                size: data.length,
                sha256: crypto.createHash("sha256").update(data).digest("hex"),
              });
            }
            const candidatePath = path.join("target", "publish", candidateName);
            const candidateBytes = fs.readFileSync(candidatePath);
            const record = {
              tag_name: release.data.tag_name,
              draft: release.data.draft,
              prerelease: release.data.prerelease,
              target_commitish: release.data.target_commitish,
              assets: downloadedAssets,
              platform_evidence: {
                windows_x86_64: JSON.parse(fs.readFileSync(path.join("target", "publish", `rho-${version}-windows-x86_64-evidence.json`), "utf8")),
                macos_aarch64: JSON.parse(fs.readFileSync(path.join("target", "publish", `rho-${version}-macos-aarch64-evidence.json`), "utf8")),
              },
              candidate_evidence: JSON.parse(candidateBytes.toString("utf8")),
              candidate_evidence_asset: {
                name: candidateName,
                size_bytes: candidateBytes.length,
                sha256: crypto.createHash("sha256").update(candidateBytes).digest("hex"),
              },
              acceptance_evidence: JSON.parse(fs.readFileSync(path.join("target", "publish", acceptanceName), "utf8")),
            };
            fs.writeFileSync("target/publish-record.json", `${JSON.stringify(record, null, 2)}\n`);
            fs.writeFileSync("target/publish-release-snapshot.json", `${JSON.stringify({
              release_id: release.data.id,
              tag_name: release.data.tag_name,
              target_commitish: release.data.target_commitish,
              assets: release.data.assets.map((asset) => [asset.id, asset.name, asset.size]).sort((left, right) => left[1].localeCompare(right[1])),
            }, null, 2)}\n`);
            core.setOutput("release_id", String(release.data.id));

      - name: Enforce immutable candidate and explicit MAC5 GO
        shell: bash
        run: |
          set -euo pipefail
          node scripts/candidate-release.mjs --mode publish --input target/publish-record.json

      - name: Publish without rebuilding or changing assets
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const releaseId = Number(process.env.RELEASE_ID);
            const snapshot = JSON.parse(fs.readFileSync("target/publish-release-snapshot.json", "utf8"));
            const before = await github.rest.repos.getRelease({ owner, repo, release_id: releaseId });
            if (!before.data.draft || !before.data.prerelease) throw new Error("Draft state changed after admission validation.");
            const beforeAssets = before.data.assets.map((asset) => [asset.id, asset.name, asset.size]).sort((left, right) => left[1].localeCompare(right[1]));
            if (
              snapshot.release_id !== releaseId
              || snapshot.tag_name !== before.data.tag_name
              || snapshot.target_commitish !== before.data.target_commitish
              || JSON.stringify(snapshot.assets) !== JSON.stringify(beforeAssets)
            ) throw new Error("Draft identity or assets changed after content validation.");
            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: releaseId,
              draft: false,
              prerelease: true,
            });
            const after = await github.rest.repos.getRelease({ owner, repo, release_id: releaseId });
            const afterAssets = after.data.assets.map((asset) => [asset.id, asset.name, asset.size]).sort((left, right) => left[1].localeCompare(right[1]));
            if (after.data.draft || !after.data.prerelease || JSON.stringify(afterAssets) !== JSON.stringify(beforeAssets)) {
              throw new Error("Published release state or immutable assets do not match admission.");
            }

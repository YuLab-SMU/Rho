name: Publish Update Site

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Windows Manual Publish", "Publish Rho Candidate"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: rho-update-site
  cancel-in-progress: false

jobs:
  publish-update-site:
    name: Publish update site from GitHub Releases
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Check out site generator
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Refuse normal Pages deployment while an acceptance fixture is active
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: target/current-pages
          fetch-depth: 1
          persist-credentials: false

      - name: Validate that no acceptance fixture can be overwritten
        shell: bash
        run: node scripts/native-updater-acceptance.mjs --mode assert-no-active-fixture --site target/current-pages

      - name: Collect validated release records
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const crypto = require("crypto");
            const fs = require("fs");
            const path = require("path");
            const childProcess = require("child_process");
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const records = [];
            for (const release of releases.filter((item) => !item.draft)) {
              const version = String(release.tag_name || "").replace(/^v/, "");
              const targetMarkerAssets = release.assets.filter((asset) => /-native-updater-acceptance-target\.json$/.test(asset.name || ""));
              if (targetMarkerAssets.length) {
                const markerName = "rho-0.4.0-dev.41-native-updater-acceptance-target.json";
                if (
                  targetMarkerAssets.length !== 1
                  || version !== "0.4.0-dev.41"
                  || targetMarkerAssets[0].name !== markerName
                  || release.assets.some((asset) => asset.name === `rho-${version}-acceptance.json`)
                ) throw new Error(`Native updater acceptance target marker is invalid for ${release.tag_name}`);
                const targetEvidenceAsset = release.assets.find((asset) => asset.name === `rho-${version}-candidate-evidence.json`);
                if (!targetEvidenceAsset || targetEvidenceAsset.size <= 0 || targetEvidenceAsset.size > 256 * 1024) {
                  throw new Error(`Native updater acceptance target evidence is missing or exceeds its byte budget for ${release.tag_name}`);
                }
                const evidenceResponse = await github.request("GET /repos/{owner}/{repo}/releases/assets/{asset_id}", {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: targetEvidenceAsset.id,
                  headers: { accept: "application/octet-stream" },
                });
                const evidenceBytes = Buffer.from(evidenceResponse.data);
                if (evidenceBytes.length !== targetEvidenceAsset.size || JSON.parse(evidenceBytes.toString("utf8")).type !== "rho_candidate_evidence") {
                  throw new Error(`Native updater acceptance target evidence is malformed for ${release.tag_name}`);
                }
                const directory = path.join("target", "native-updater-acceptance-target", version);
                fs.mkdirSync(directory, { recursive: true });
                const names = new Set();
                for (const asset of release.assets) {
                  if (!asset?.name || path.basename(asset.name) !== asset.name || names.has(asset.name) || !Number.isSafeInteger(asset.size) || asset.size <= 0) {
                    throw new Error(`Native updater acceptance target asset is unsafe or duplicated: ${asset?.name || "<empty>"}`);
                  }
                  names.add(asset.name);
                  const response = await github.request("GET /repos/{owner}/{repo}/releases/assets/{asset_id}", {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    asset_id: asset.id,
                    headers: { accept: "application/octet-stream" },
                  });
                  const bytes = Buffer.from(response.data);
                  if (bytes.length !== asset.size) throw new Error(`Native updater acceptance target asset size mismatch for ${asset.name}`);
                  fs.writeFileSync(path.join(directory, asset.name), bytes, { flag: "wx" });
                }
                const releaseRecord = {
                  release_id: String(release.id),
                  tag_name: release.tag_name,
                  target_commitish: release.target_commitish,
                  draft: release.draft,
                  prerelease: release.prerelease,
                  name: release.name || "",
                  body: release.body || "",
                  published_at: release.published_at,
                  html_url: release.html_url,
                  assets: release.assets.map((asset) => ({ name: asset.name, size: asset.size })).sort((left, right) => left.name.localeCompare(right.name)),
                };
                const releasePath = path.join("target", "native-updater-acceptance-target", `${version}-release.json`);
                fs.writeFileSync(releasePath, `${JSON.stringify(releaseRecord, null, 2)}\n`, { flag: "wx" });
                childProcess.execFileSync(process.execPath, [
                  path.join(process.cwd(), "scripts", "native-updater-acceptance.mjs"),
                  "--mode", "validate-public-target",
                  "--release", releasePath,
                  "--directory", directory,
                ], { stdio: "inherit" });
                continue;
              }
              const evidenceAsset = release.assets.find((asset) => asset.name === `rho-${version}-candidate-evidence.json`)
                || release.assets.find((asset) => asset.name === "rho-0.2-release.json");
              if (!evidenceAsset) continue;
              if (evidenceAsset.size <= 0 || evidenceAsset.size > 256 * 1024) throw new Error(`Release evidence exceeds its byte budget for ${release.tag_name}`);
              const response = await github.request("GET /repos/{owner}/{repo}/releases/assets/{asset_id}", {
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: evidenceAsset.id,
                headers: { accept: "application/octet-stream" },
              });
              const evidenceBytes = Buffer.from(response.data);
              if (evidenceBytes.length !== evidenceAsset.size) throw new Error(`Release evidence size mismatch for ${release.tag_name}`);
              const evidenceSha256 = crypto.createHash("sha256").update(evidenceBytes).digest("hex");
              const evidence = JSON.parse(evidenceBytes.toString("utf8"));
              if (version === "0.4.0-dev.41" && evidence.type === "rho_candidate_evidence") {
                throw new Error("The public dev.41 native updater acceptance target is missing its required exclusion marker.");
              }
              let platformEvidence;
              let acceptanceEvidence;
              let nativeUpdaterEvidence;
              let nativeUpdaterEvidenceAsset;
              let nativeUpdaterSignatures;
              if (evidence.type === "rho_candidate_evidence") {
                const acceptanceAsset = release.assets.find((asset) => asset.name === `rho-${version}-acceptance.json`);
                if (!acceptanceAsset || acceptanceAsset.size <= 0 || acceptanceAsset.size > 256 * 1024) {
                  throw new Error(`Candidate acceptance asset is missing or exceeds its byte budget for ${release.tag_name}`);
                }
                const acceptanceResponse = await github.request("GET /repos/{owner}/{repo}/releases/assets/{asset_id}", {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: acceptanceAsset.id,
                  headers: { accept: "application/octet-stream" },
                });
                const acceptanceBytes = Buffer.from(acceptanceResponse.data);
                if (acceptanceBytes.length !== acceptanceAsset.size) throw new Error(`Candidate acceptance size mismatch for ${release.tag_name}`);
                acceptanceEvidence = JSON.parse(acceptanceBytes.toString("utf8"));
                platformEvidence = {};
                for (const platform of Object.keys(evidence.platforms || {})) {
                  const expected = evidence.platforms?.[platform]?.evidence;
                  const asset = release.assets.find((item) => item.name === expected?.name);
                  if (!expected || !asset || asset.size !== expected.size_bytes || asset.size <= 0 || asset.size > 256 * 1024) {
                    throw new Error(`Platform evidence asset mismatch for ${release.tag_name} ${platform}`);
                  }
                  const platformResponse = await github.request("GET /repos/{owner}/{repo}/releases/assets/{asset_id}", {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    asset_id: asset.id,
                    headers: { accept: "application/octet-stream" },
                  });
                  const bytes = Buffer.from(platformResponse.data);
                  const sha256 = crypto.createHash("sha256").update(bytes).digest("hex");
                  if (bytes.length !== expected.size_bytes || sha256 !== expected.sha256) {
                    throw new Error(`Platform evidence content mismatch for ${release.tag_name} ${platform}`);
                  }
                  platformEvidence[platform] = { size_bytes: bytes.length, sha256, content: JSON.parse(bytes.toString("utf8")) };
                }
                const nativeEvidenceName = `rho-${version}-tauri-native-updater-evidence.json`;
                const nativeSignatureNames = {
                  windows_x86_64: `Rho_${version}_x64-setup.exe.sig`,
                  macos_aarch64: `Rho_${version}_aarch64.app.tar.gz.sig`,
                  ...(evidence.platforms?.linux_x86_64 ? { linux_x86_64: `Rho_${version}_x86_64.AppImage.sig` } : {}),
                };
                const nativeEvidenceAssetCandidate = release.assets.find((asset) => asset.name === nativeEvidenceName);
                const anyNativeAsset = release.assets.some((asset) => asset.name === nativeEvidenceName || Object.values(nativeSignatureNames).includes(asset.name));
                if (anyNativeAsset && !nativeEvidenceAssetCandidate) {
                  throw new Error(`Native updater asset set is incomplete for ${release.tag_name}`);
                }
                if (nativeEvidenceAssetCandidate) {
                  if (nativeEvidenceAssetCandidate.size <= 0 || nativeEvidenceAssetCandidate.size > 256 * 1024) {
                    throw new Error(`Native updater evidence exceeds its byte budget for ${release.tag_name}`);
                  }
                  const nativeEvidenceResponse = await github.request("GET /repos/{owner}/{repo}/releases/assets/{asset_id}", {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    asset_id: nativeEvidenceAssetCandidate.id,
                    headers: { accept: "application/octet-stream" },
                  });
                  const nativeEvidenceBytes = Buffer.from(nativeEvidenceResponse.data);
                  const nativeEvidenceSha256 = crypto.createHash("sha256").update(nativeEvidenceBytes).digest("hex");
                  if (nativeEvidenceBytes.length !== nativeEvidenceAssetCandidate.size) {
                    throw new Error(`Native updater evidence size mismatch for ${release.tag_name}`);
                  }
                  nativeUpdaterEvidence = JSON.parse(nativeEvidenceBytes.toString("utf8"));
                  nativeUpdaterEvidenceAsset = {
                    name: nativeEvidenceAssetCandidate.name,
                    size_bytes: nativeEvidenceBytes.length,
                    sha256: nativeEvidenceSha256,
                  };
                  nativeUpdaterSignatures = {};
                  for (const [platform, signatureName] of Object.entries(nativeSignatureNames)) {
                    const signatureAsset = release.assets.find((asset) => asset.name === signatureName);
                    if (!signatureAsset || signatureAsset.size <= 0 || signatureAsset.size > 16 * 1024) {
                      throw new Error(`Native updater signature asset is missing or exceeds its byte budget for ${release.tag_name} ${platform}`);
                    }
                    const signatureResponse = await github.request("GET /repos/{owner}/{repo}/releases/assets/{asset_id}", {
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      asset_id: signatureAsset.id,
                      headers: { accept: "application/octet-stream" },
                    });
                    const signatureBytes = Buffer.from(signatureResponse.data);
                    if (signatureBytes.length !== signatureAsset.size) {
                      throw new Error(`Native updater signature size mismatch for ${release.tag_name} ${platform}`);
                    }
                    nativeUpdaterSignatures[platform] = signatureBytes.toString("utf8");
                  }
                }
              }
              records.push({
                tag_name: release.tag_name,
                draft: release.draft,
                prerelease: release.prerelease,
                published_at: release.published_at,
                html_url: release.html_url,
                target_commitish: release.target_commitish,
                summary: String(release.body || "").split("\n").find((line) => line.trim()) || `Rho ${release.tag_name.replace(/^v/, "")} is available.`,
                assets: release.assets.map((asset) => ({
                  name: asset.name,
                  size: asset.size,
                  browser_download_url: asset.browser_download_url,
                })),
                evidence,
                evidence_sha256: evidenceSha256,
                acceptance_evidence: acceptanceEvidence,
                platform_evidence: platformEvidence,
                native_updater_evidence: nativeUpdaterEvidence,
                native_updater_evidence_asset: nativeUpdaterEvidenceAsset,
                native_updater_signatures: nativeUpdaterSignatures,
              });
            }
            fs.mkdirSync("target", { recursive: true });
            fs.writeFileSync("target/releases-for-pages.json", JSON.stringify(records, null, 2));

      - name: Generate and test update site
        id: update_site
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate-update-site.mjs --test true
          result="$(node scripts/generate-update-site.mjs --input target/releases-for-pages.json --output target/pages)"
          development_version="$(node -e 'const value=JSON.parse(process.argv[1]); if(!value.development) process.exit(1); process.stdout.write(value.development)' "$result")"
          native_development_version="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(value.native_development || "")' "$result")"
          development_has_macos="$(node -e 'const fs=require("fs"); const value=JSON.parse(fs.readFileSync("target/pages/updates/development.json", "utf8")); process.stdout.write(String(Boolean(value.artifacts.macos_aarch64)))')"
          echo "development_version=$development_version" >> "$GITHUB_OUTPUT"
          echo "native_development_version=$native_development_version" >> "$GITHUB_OUTPUT"
          echo "development_has_macos=$development_has_macos" >> "$GITHUB_OUTPUT"

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: target/pages
          force_orphan: true

      - name: Verify deployed development manifest
        shell: bash
        env:
          EXPECTED_DEVELOPMENT_VERSION: ${{ steps.update_site.outputs.development_version }}
          EXPECTED_MACOS: ${{ steps.update_site.outputs.development_has_macos }}
        run: |
          set -euo pipefail
          development_url="https://yulab-smu.top/Rho/updates/development.json"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error "$development_url?attempt=$attempt" -o development.json; then
              if node -e 'const fs=require("fs"); const value=JSON.parse(fs.readFileSync("development.json","utf8")); const artifacts=value.artifacts||{}; const keys=Object.keys(artifacts).sort(); const expected=value.version==="0.4.0-dev.43"?["linux_x86_64","macos_aarch64","windows_x86_64"]:["macos_aarch64","windows_x86_64"]; const validArtifacts=keys.length>0 && keys.every((key)=>/^[0-9a-f]{64}$/.test(artifacts[key].sha256) && Number.isSafeInteger(artifacts[key].size) && artifacts[key].size>0); if(value.schema_version!==1 || value.channel!=="development" || value.version!==process.env.EXPECTED_DEVELOPMENT_VERSION || JSON.stringify(keys)!==JSON.stringify(expected) || !validArtifacts) process.exit(1)'; then
                exit 0
              fi
            fi
            sleep 10
          done
          echo "The deployed development manifest did not reach $EXPECTED_DEVELOPMENT_VERSION." >&2
          exit 1

      - name: Verify deployed native updater manifest
        if: ${{ steps.update_site.outputs.native_development_version != '' }}
        shell: bash
        env:
          EXPECTED_NATIVE_DEVELOPMENT_VERSION: ${{ steps.update_site.outputs.native_development_version }}
        run: |
          set -euo pipefail
          native_url="https://yulab-smu.top/Rho/updates/tauri/development.json"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error "$native_url?attempt=$attempt" -o native-development.json; then
              if node -e 'const fs=require("fs"); const value=JSON.parse(fs.readFileSync("native-development.json","utf8")); const keys=Object.keys(value.platforms||{}).sort(); const expected=value.version==="0.4.0-dev.43"?["darwin-aarch64","linux-x86_64","windows-x86_64"]:["darwin-aarch64","windows-x86_64"]; const valid=JSON.stringify(keys)===JSON.stringify(expected) && keys.every((key)=>typeof value.platforms[key].url==="string" && typeof value.platforms[key].signature==="string" && value.platforms[key].signature.length>0); if(value.version!==process.env.EXPECTED_NATIVE_DEVELOPMENT_VERSION || !valid) process.exit(1)'; then
                exit 0
              fi
            fi
            sleep 10
          done
          echo "The deployed native development manifest did not reach $EXPECTED_NATIVE_DEVELOPMENT_VERSION." >&2
          exit 1

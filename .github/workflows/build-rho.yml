name: Build Rho macOS preview binary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binary:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.97.0-aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify preview target
        shell: bash
        run: |
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "arm64"
          sw_vers
      - name: Install pinned Rust
        shell: bash
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
      - name: Build embedded local workbench
        run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: rho-macos-arm64-${{ github.sha }}
          path: target/release/rho
          if-no-files-found: error
      # This produces a binary artifact only. No installer, signing, Release,
      # update-site publication, deployment or automatic installation occurs.

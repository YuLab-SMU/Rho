name: Build Linux AppImage

# LIN2 hosted lane: builds the Rho Linux x64 AppImage on the documented
# Ubuntu 22.04 dependency baseline, runs the LIN1/LIN3 fixture gates, and
# fails closed if the produced AppImage is not executable or its internal
# AppRun does not contain the WebKitGTK 4.1 dependency check.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact current default-branch commit or ref to build
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: rho-linux-appimage-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Rho Linux x64 AppImage
    runs-on: ubuntu-22.04
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove checked-out identity
        shell: bash
        run: |
          set -euo pipefail
          requested="$(git rev-parse "${{ inputs.ref }}^{commit}")"
          if [[ "$(git rev-parse HEAD)" != "$requested" ]]; then
            echo "Checked-out commit is not the requested commit $requested." >&2
            exit 1
          fi

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file unzip zip \
            libwebkit2gtk-4.1-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            squashfs-tools pkg-config

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust (pinned 1.97.0)
        shell: bash
        run: |
          set -euo pipefail
          rustup set profile minimal
          rustup toolchain install 1.97.0-x86_64-unknown-linux-gnu --no-self-update
          rustup default 1.97.0
          active="$(rustup show active-toolchain)"
          [[ "$active" == "1.97.0-x86_64-unknown-linux-gnu "* ]]
          rustc -vV | grep -Fx "host: x86_64-unknown-linux-gnu"

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"
          use-public-rspm: true

      - name: Run AppRun dependency-check fixtures (LIN3)
        shell: bash
        run: scripts/test-linux-apprun.sh

      - name: Bootstrap Ark linux-x64 sidecar (LIN1)
        shell: bash
        run: |
          set -euo pipefail
          scripts/bootstrap-ark-linux.sh
          scripts/test-bootstrap-ark-linux.sh

      - name: Run source-install diagnostics fixtures (S1)
        shell: bash
        run: scripts/test-install-from-source.sh

      - name: Build the AppImage (LIN2)
        id: build
        shell: bash
        run: scripts/build-linux.sh

      - name: Assert AppImage contract
        shell: bash
        env:
          APP_VERSION: ${{ steps.build.outputs.app_version }}
        run: |
          set -euo pipefail
          if [[ -z "$APP_VERSION" ]]; then
            echo "Build step did not report app_version." >&2
            exit 1
          fi
          appimage="target/release/bundle/appimage/Rho_${APP_VERSION}_x86_64.AppImage"
          appimage_abs="$(realpath "$appimage")"
          test -x "$appimage_abs"
          verify_dir="$(mktemp -d "${TMPDIR:-/tmp}/rho-verify.XXXXXX")"
          trap 'rm -rf -- "$verify_dir"' EXIT
          (cd "$verify_dir" && "$appimage_abs" --appimage-extract >/dev/null)
          grep -q 'libwebkit2gtk-4\.1\.so\.0' "$verify_dir/squashfs-root/AppRun"
          test -s "$appimage.sha256"
          echo "AppImage executable and AppRun dependency check verified: $appimage"

      - name: Upload the AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: rho-linux-x64-appimage
          path: |
            target/release/bundle/appimage/Rho_*_x86_64.AppImage
            target/release/bundle/appimage/Rho_*_x86_64.AppImage.sha256
            target/release/bundle/appimage/Rho_*_x86_64.AppImage.sig
          if-no-files-found: error
          retention-days: 14

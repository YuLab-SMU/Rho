name: Issue 33 Windows Installed Acceptance

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact current default-branch ref to install and verify
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: issue-33-windows-installed-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  installed-windows:
    name: Install and repeat Issue 33 on Windows x64
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      RTOOLS_BIN: C:\rtools45\x86_64-w64-mingw32.static.posix\bin
      RHO_RTOOLS_BIN: C:\rtools45\x86_64-w64-mingw32.static.posix\bin
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu

    steps:
      - name: Check out requested default-branch identity
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Admit exact protected main and synchronized dev.37 identity
        shell: pwsh
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch origin "refs/heads/$env:DEFAULT_BRANCH:refs/remotes/origin/$env:DEFAULT_BRANCH"
          $commit = (& git rev-parse HEAD).Trim()
          $defaultCommit = (& git rev-parse "refs/remotes/origin/$env:DEFAULT_BRANCH").Trim()
          if ($commit -ne $defaultCommit) {
            throw "Requested commit $commit is not current protected $env:DEFAULT_BRANCH at $defaultCommit."
          }
          $cargo = Get-Content -LiteralPath Cargo.toml -Raw
          $match = [regex]::Match($cargo, '(?m)^version = "([^"]+)"')
          if (-not $match.Success) { throw "Cargo application version is unavailable." }
          $version = $match.Groups[1].Value
          if ($version -ne "0.4.0-dev.37") { throw "Issue #33 acceptance requires fresh 0.4.0-dev.37, found $version." }
          if (-not (Test-Path -LiteralPath "docs\release\active-0.4.0-dev.37-candidate-checklist.md")) {
            throw "The active dev.37 acceptance checklist is missing."
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "RHO_ACCEPTANCE_COMMIT=$commit"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "RHO_ACCEPTANCE_VERSION=$version"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "RHO_BUILD_COMMIT=$commit"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked frontend dependencies
        run: npm ci --prefix desktop

      - name: Set up R and Rtools
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"
          rtools-version: "45"
          use-public-rspm: true

      - name: Install Workspace R runtime dependencies
        shell: pwsh
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Rscript -e "if (!requireNamespace('remotes', quietly = TRUE)) install.packages('remotes')"
          Rscript -e "remotes::install_deps('r/rho.bridge', dependencies = TRUE, upgrade = 'never')"
          Rscript -e "remotes::install_deps('r/rho.agent', dependencies = TRUE, upgrade = 'never')"
          $rscript = (& Rscript -e "cat(normalizePath(file.path(R.home('bin'), 'Rscript.exe'), winslash='/', mustWork=TRUE))").Trim()
          if (-not $rscript) { throw "Could not resolve Rscript.exe." }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "RHO_RSCRIPT=$rscript"

      - name: Install Windows GNU Rust toolchain
        shell: pwsh
        run: |
          rustup set profile minimal
          rustup toolchain install stable-x86_64-pc-windows-gnu --no-self-update
          rustup component add rustfmt --toolchain stable-x86_64-pc-windows-gnu
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "CARGO_HOME=$env:USERPROFILE\.cargo"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "RUSTUP_HOME=$env:USERPROFILE\.rustup"

      - name: Bootstrap pinned Windows Ark runtime
        shell: pwsh
        run: |
          $env:PATH="$env:RTOOLS_BIN;$env:PATH"
          ./scripts/bootstrap-ark-windows.ps1 -RscriptPath "$env:RHO_RSCRIPT"

      - name: Verify focused source and installed-acceptance contracts
        shell: pwsh
        run: |
          npm --prefix desktop run rsr:check
          node --check scripts/windows-installed-focus-acceptance.mjs
          node scripts/test-windows-installed-focus-acceptance.mjs
          node scripts/test-mac4-release-contract.mjs
          $dirtyPaths = @(& git status --short)
          if ($dirtyPaths.Count -gt 0) { throw "Focused validation changed the exact source tree: $($dirtyPaths -join ', ')" }

      - name: Build exact Windows NSIS review package
        shell: pwsh
        run: |
          $env:PATH="$env:RTOOLS_BIN;$env:PATH"
          ./scripts/build-windows-installer.ps1 `
            -TauriConfigOverlayPath "desktop\src-tauri\tauri.issue33-acceptance.conf.json" `
            -MaximumTauriBuildAttempts 3
          $expected = "Rho_$($env:RHO_ACCEPTANCE_VERSION)_x64-setup.exe"
          $installer = @(Get-ChildItem -LiteralPath "target\release\bundle\nsis" -Filter "*-setup.exe")
          if ($installer.Count -ne 1 -or $installer[0].Name -ne $expected) {
            throw "Expected exactly $expected."
          }
          New-Item -ItemType Directory -Path "target\issue33" -Force | Out-Null
          $reviewInstaller = Join-Path $PWD "target\issue33\$expected"
          Copy-Item -LiteralPath $installer[0].FullName -Destination $reviewInstaller
          $hash = (Get-FileHash -LiteralPath $reviewInstaller -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$reviewInstaller.sha256" -Value "$hash  $expected" -Encoding utf8NoBOM
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "RHO_ISSUE33_INSTALLER=$reviewInstaller"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "RHO_ISSUE33_INSTALLER_SHA256=$hash"

      - name: Silently install exact NSIS package and resolve installed bytes
        shell: pwsh
        run: |
          function ConvertFrom-RhoRegistryPath {
            param([AllowNull()][object]$Value)
            if ($null -eq $Value) { return $null }
            $pathValue = ([string]$Value).Trim()
            $startsQuoted = $pathValue.StartsWith('"')
            $endsQuoted = $pathValue.EndsWith('"')
            if ($startsQuoted -xor $endsQuoted) {
              throw "Malformed quoted registry path: $pathValue"
            }
            if ($startsQuoted -and $pathValue.Length -ge 2) {
              $pathValue = $pathValue.Substring(1, $pathValue.Length - 2)
            }
            if (-not $pathValue -or -not [System.IO.Path]::IsPathFullyQualified($pathValue)) {
              throw "Registry path is not fully qualified: $pathValue"
            }
            return $pathValue
          }

          $installerProcess = Start-Process -FilePath $env:RHO_ISSUE33_INSTALLER -ArgumentList "/S" -PassThru -Wait
          if ($installerProcess.ExitCode -ne 0) { throw "NSIS silent install failed with $($installerProcess.ExitCode)." }

          $registryPaths = @(
            "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*"
          )
          $entry = Get-ItemProperty -Path $registryPaths -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -eq "Rho" -or $_.DisplayName -like "Rho *" } |
            Select-Object -First 1
          if (-not $entry) { throw "The installed Rho registry entry was not found." }

          $candidates = [System.Collections.Generic.List[string]]::new()
          $installLocation = ConvertFrom-RhoRegistryPath $entry.InstallLocation
          if ($installLocation) {
            $candidates.Add((Join-Path $installLocation "rho-desktop.exe"))
            $candidates.Add((Join-Path $installLocation "Rho.exe"))
          }
          if ($entry.DisplayIcon) {
            $icon = [regex]::Match([string]$entry.DisplayIcon, '^"?(.+?\.exe)"?(?:,\d+)?$')
            if ($icon.Success) { $candidates.Add($icon.Groups[1].Value) }
          }
          $candidates.Add((Join-Path $env:LOCALAPPDATA "Rho\rho-desktop.exe"))
          $candidates.Add((Join-Path $env:LOCALAPPDATA "Programs\Rho\rho-desktop.exe"))
          $app = $candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $app) {
            $app = Get-ChildItem -LiteralPath $env:LOCALAPPDATA -Filter "rho-desktop.exe" -File -Recurse -Depth 5 -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName -First 1
          }
          if (-not $app) { throw "The installed rho-desktop.exe was not found." }
          $app = (Resolve-Path -LiteralPath $app).Path
          $workspaceRoot = (Resolve-Path -LiteralPath $env:GITHUB_WORKSPACE).Path
          if ($app.StartsWith($workspaceRoot, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "Acceptance resolved the build-tree executable instead of installed bytes: $app"
          }
          $installRoot = Split-Path -Parent $app
          $arkCandidates = @(
            (Join-Path $installRoot "resources\runtime\ark.exe"),
            (Join-Path $installRoot "resources\resources\runtime\ark.exe")
          )
          $ark = $arkCandidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $ark) { throw "Installed Ark runtime was not found under $installRoot." }

          $uninstall = $null
          if ($entry.UninstallString) {
            $uninstallMatch = [regex]::Match([string]$entry.UninstallString, '^"?(.+?\.exe)"?(?:\s.*)?$')
            if ($uninstallMatch.Success) { $uninstall = $uninstallMatch.Groups[1].Value }
          }
          if (-not $uninstall -or -not (Test-Path -LiteralPath $uninstall -PathType Leaf)) {
            $uninstall = Get-ChildItem -LiteralPath $installRoot -Filter "uninstall*.exe" -File -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName -First 1
          }
          if (-not $uninstall -or -not (Test-Path -LiteralPath $uninstall -PathType Leaf)) {
            throw "The exact registered Rho uninstaller was not found."
          }

          $installEvidence = [ordered]@{
            status = "installed"
            display_name = $entry.DisplayName
            display_version = $entry.DisplayVersion
            install_root = $installRoot
            executable = $app
            executable_sha256 = (Get-FileHash -LiteralPath $app -Algorithm SHA256).Hash.ToLowerInvariant()
            ark_runtime = (Resolve-Path -LiteralPath $ark).Path
            uninstaller = (Resolve-Path -LiteralPath $uninstall).Path
          }
          $installEvidence | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath "target\issue33\install.json" -Encoding utf8NoBOM
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "RHO_INSTALLED_EXE=$app"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "RHO_INSTALL_ROOT=$installRoot"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "RHO_UNINSTALL_EXE=$uninstall"

      - name: Create disposable installed-interaction project
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP "rho-issue33-installed-project"
          New-Item -ItemType Directory -Path $fixture -Force | Out-Null
          $analysis = (1..240 | ForEach-Object { "issue33_line_$($_) <- $($_)" }) -join "`n"
          [System.IO.File]::WriteAllText((Join-Path $fixture "analysis.R"), "$analysis`n", [System.Text.UTF8Encoding]::new($false))
          [System.IO.File]::WriteAllText((Join-Path $fixture "helper.R"), "helper_value <- 1`n", [System.Text.UTF8Encoding]::new($false))
          [System.IO.File]::WriteAllText((Join-Path $fixture "watch.md"), "# watcher fixture`n", [System.Text.UTF8Encoding]::new($false))
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "RHO_ISSUE33_PROJECT=$fixture"

      - name: Run six scenarios in the installed Tauri application
        shell: pwsh
        run: |
          $rho = Start-Process -FilePath $env:RHO_INSTALLED_EXE -PassThru
          try {
            node scripts/windows-installed-focus-acceptance.mjs `
              --port 9222 `
              --expected-version $env:RHO_ACCEPTANCE_VERSION `
              --expected-commit $env:RHO_ACCEPTANCE_COMMIT `
              --project $env:RHO_ISSUE33_PROJECT `
              --installer $env:RHO_ISSUE33_INSTALLER `
              --installed-executable $env:RHO_INSTALLED_EXE `
              --forbidden-root $env:GITHUB_WORKSPACE `
              --output (Join-Path $PWD "target\issue33\acceptance.json") `
              --screenshot (Join-Path $PWD "target\issue33\installed.png") 2>&1 |
              Tee-Object -FilePath "target\issue33\acceptance.log"
            if ($LASTEXITCODE -ne 0) { throw "Installed Issue #33 acceptance failed." }
          }
          finally {
            Get-Process -Name "rho-desktop" -ErrorAction SilentlyContinue |
              Where-Object { $_.Path -eq $env:RHO_INSTALLED_EXE } |
              Stop-Process -Force -ErrorAction SilentlyContinue
            if (-not $rho.HasExited) { Stop-Process -Id $rho.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Uninstall exact package and record cleanup
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "target\issue33" -Force | Out-Null
          function ConvertFrom-RhoRegistryPath {
            param([AllowNull()][object]$Value)
            if ($null -eq $Value) { return $null }
            $pathValue = ([string]$Value).Trim()
            $startsQuoted = $pathValue.StartsWith('"')
            $endsQuoted = $pathValue.EndsWith('"')
            if ($startsQuoted -xor $endsQuoted) {
              throw "Malformed quoted registry path: $pathValue"
            }
            if ($startsQuoted -and $pathValue.Length -ge 2) {
              $pathValue = $pathValue.Substring(1, $pathValue.Length - 2)
            }
            if (-not $pathValue -or -not [System.IO.Path]::IsPathFullyQualified($pathValue)) {
              throw "Registry path is not fully qualified: $pathValue"
            }
            return $pathValue
          }

          function Get-RhoUninstallEntry {
            $registryPaths = @(
              "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*",
              "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*",
              "HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*"
            )
            Get-ItemProperty -Path $registryPaths -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName -eq "Rho" -or $_.DisplayName -like "Rho *" } |
              Select-Object -First 1
          }

          Get-Process -Name "rho-desktop" -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          $entry = Get-RhoUninstallEntry
          $installedExecutable = $env:RHO_INSTALLED_EXE
          $installLocation = ConvertFrom-RhoRegistryPath $entry.InstallLocation
          if (-not $installedExecutable -and $installLocation) {
            $installedExecutable = @(
              (Join-Path $installLocation "rho-desktop.exe"),
              (Join-Path $installLocation "Rho.exe")
            ) | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          }
          $uninstall = $env:RHO_UNINSTALL_EXE
          if ((-not $uninstall -or -not (Test-Path -LiteralPath $uninstall -PathType Leaf)) -and $entry.UninstallString) {
            $uninstallMatch = [regex]::Match([string]$entry.UninstallString, '^"?(.+?\.exe)"?(?:\s.*)?$')
            if ($uninstallMatch.Success) { $uninstall = $uninstallMatch.Groups[1].Value }
          }
          $installationDetected = [bool]$entry -or ($installedExecutable -and (Test-Path -LiteralPath $installedExecutable -PathType Leaf))
          $cleanup = [ordered]@{
            attempted = $false
            status = if ($installationDetected) { "FAIL" } else { "not_installed" }
            installation_detected = $installationDetected
            uninstaller = $uninstall
            executable_removed = $null
            registry_removed = $null
            timestamp = (Get-Date).ToUniversalTime().ToString("o")
          }
          if ($uninstall -and (Test-Path -LiteralPath $uninstall -PathType Leaf)) {
            $cleanup.attempted = $true
            $process = Start-Process -FilePath $uninstall -ArgumentList "/S" -PassThru -Wait
            $cleanup.exit_code = $process.ExitCode
            for ($attempt = 0; $attempt -lt 60; $attempt += 1) {
              $executableRemoved = -not $installedExecutable -or -not (Test-Path -LiteralPath $installedExecutable -PathType Leaf)
              $registryRemoved = -not [bool](Get-RhoUninstallEntry)
              if ($executableRemoved -and $registryRemoved) { break }
              Start-Sleep -Milliseconds 500
            }
            $cleanup.executable_removed = -not $installedExecutable -or -not (Test-Path -LiteralPath $installedExecutable -PathType Leaf)
            $cleanup.registry_removed = -not [bool](Get-RhoUninstallEntry)
            $cleanup.status = if ($process.ExitCode -eq 0 -and $cleanup.executable_removed -and $cleanup.registry_removed) { "PASS" } else { "FAIL" }
          }
          $logCandidates = @(
            (Join-Path $env:APPDATA "org.yulab.rho\logs\startup.jsonl"),
            (Join-Path $env:LOCALAPPDATA "org.yulab.rho\logs\startup.jsonl")
          )
          $startupLog = $logCandidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if ($startupLog) { Copy-Item -LiteralPath $startupLog -Destination "target\issue33\startup.jsonl" -Force }
          $cleanup | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath "target\issue33\cleanup.json" -Encoding utf8NoBOM
          if (Test-Path -LiteralPath "target\issue33\acceptance.json") {
            $acceptance = Get-Content -LiteralPath "target\issue33\acceptance.json" -Raw | ConvertFrom-Json
            $acceptance | Add-Member -NotePropertyName cleanup -NotePropertyValue $cleanup -Force
            $acceptance | ConvertTo-Json -Depth 100 | Set-Content -LiteralPath "target\issue33\acceptance.json" -Encoding utf8NoBOM
          }
          if ($installationDetected -and $cleanup.status -ne "PASS") {
            throw "Installed Rho cleanup did not complete truthfully."
          }

      - name: Upload exact installed-acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rho-${{ env.RHO_ACCEPTANCE_VERSION }}-issue33-windows-installed-${{ env.RHO_ACCEPTANCE_COMMIT }}-${{ github.run_id }}
          path: |
            target/issue33/Rho_${{ env.RHO_ACCEPTANCE_VERSION }}_x64-setup.exe
            target/issue33/Rho_${{ env.RHO_ACCEPTANCE_VERSION }}_x64-setup.exe.sha256
            target/issue33/install.json
            target/issue33/acceptance.json
            target/issue33/acceptance.log
            target/issue33/startup.jsonl
            target/issue33/installed.png
            target/issue33/cleanup.json
          if-no-files-found: warn
          retention-days: 14

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Console</title><link rel="stylesheet" href="./src/style.css"></head>
<body>
  <header><strong>Console</strong><span id="identity"></span><button id="refresh">Refresh</button><button id="records">Run Details</button><button id="history">History</button><button id="agent-request" hidden>Recover Agent request</button></header>
  <div class="toolbar"><span id="status" role="status"></span><button id="start" hidden>Start R</button><button id="queue">Queue</button><button id="pause">Pause Queue</button><button id="interrupt">Interrupt</button></div>
  <div id="message" role="alert" hidden></div><div id="save-error" role="status"></div><div id="observation-error" role="status"></div><div id="pause-reason" hidden></div>
  <div id="transcript"></div>
  <div class="view-tools"><button id="earlier">Earlier Runs</button><button id="show-all">Show History</button><button id="clear">Clear View</button><button id="new-output" hidden>New Output ↓</button></div>
  <div id="history-limit" role="status" hidden></div>
  <section id="stdin" hidden><strong id="input-prompt"></strong><p id="input-status"></p><button id="answer-here">Answer Here</button><div id="answer-form" role="group" aria-label="Native R input" hidden><input id="answer" aria-label="R Input Answer" autocomplete="off" spellcheck="false"><button id="send-answer" type="button">Send Answer</button></div></section>
  <div class="prompt"><span aria-hidden="true">&gt;</span><div id="command"></div><button id="run">Run</button></div>
  <footer><span>Enter to run · Shift Enter for a new line · ⌘ Enter to submit</span><button id="inspect-submission" hidden>Inspect Original Submission</button><button id="retry" hidden>Retry Original Submission</button></footer>
  <dialog id="details"><div class="dialog-header"><strong id="details-title"></strong><button id="close-details">Close</button></div><div id="details-content"></div></dialog>
  <script type="module" src="./src/main.ts"></script>
</body></html>

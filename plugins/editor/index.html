<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editor</title><link rel="stylesheet" href="./src/style.css"></head>
<body>
<header><div class="title"><strong id="name">Editor</strong><span id="file-state"></span></div><div class="actions"><button id="save" type="button" disabled>Save</button><button id="save-as" type="button" disabled>Save As…</button></div></header>
<div id="error" role="alert" hidden></div><button id="refresh-file" type="button" hidden>Refresh File Observation</button><div id="draft-error" role="status" hidden></div>
<div id="recovery" class="recovery" hidden><button id="inspect-draft" type="button">Inspect Original Draft Save</button><button id="retry-draft" type="button">Retry Original Draft Save</button><button id="acknowledge-draft" type="button">Acknowledge Failed Draft Save</button></div>
<div id="file-recovery" class="recovery" hidden><span id="file-operation"></span><button id="inspect-file" type="button">Inspect Original File Save</button><button id="retry-file" type="button">Retry Original File Save</button><button id="acknowledge-file" type="button">Acknowledge Failed File Save</button></div>
<div id="preview" role="note" hidden></div><main id="editor"><div id="opening" role="status">Opening document…</div></main>
<footer><span id="draft-state" role="status">Connecting…</span><span id="position"></span></footer>
<dialog id="save-dialog"><div class="dialog-heading"><strong>Save As</strong><button id="cancel-save" type="button">Cancel</button></div><label for="path">Project-relative file path</label><input id="path" autocomplete="off" spellcheck="false"><label class="replace"><input id="replace" type="checkbox">Replace the observed target if it exists</label><div id="path-error" role="alert" hidden></div><button id="confirm-save" type="button">Save File</button></dialog>
<script type="module" src="./src/main.ts"></script></body></html>

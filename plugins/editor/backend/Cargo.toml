[package]
name = "rho-editor-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-only"
repository = "https://github.com/YuLab-SMU/Rho"

[dependencies]
rho-plugin-sdk = { path = "../../../crates/plugin-sdk" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.0"
sha2 = "0.10"
base64 = "0.22"
tokio = { version = "1.0", features = ["macros", "rt", "sync", "io-std", "time"] }

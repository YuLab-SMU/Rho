[package]
name = "rho-process-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-only"
repository = "https://github.com/YuLab-SMU/Rho"

[[bin]]
name = "export-process-plugin"
path = "src/bin/export-process-plugin.rs"
test = false
bench = false

[dependencies]
rho-plugin-protocol = { path = "../../../crates/plugin-protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.0"
ts-rs = { version = "=12.0.1", features = ["serde-json-impl", "no-serde-warnings"] }

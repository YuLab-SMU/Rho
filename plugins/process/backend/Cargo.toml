[package]
name = "rho-process-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-only"
repository = "https://github.com/YuLab-SMU/Rho"

[dependencies]
rho-process-api = { path = "../api" }
rho-process-owner = { path = "owner" }
rho-plugin-sdk = { path = "../../../crates/plugin-sdk" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.0"
sha2 = "0.10"
tokio = { version = "1.0", features = ["macros", "rt", "io-std", "io-util", "net", "sync", "time"] }

[dev-dependencies]
tempfile = "3.20"

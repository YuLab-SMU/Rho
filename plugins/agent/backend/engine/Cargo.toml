[package]
name = "rho-agent-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-only"
repository = "https://github.com/YuLab-SMU/Rho"

[dependencies]
rho-agent-api = { path = "../../api" }
rho-agent-owner = { path = "../owner" }
async-trait = "0.1"
uuid = { version = "1.18", features = ["v4"] }
jsonschema = { version = "0.52", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
rig = { version = "=0.42.0", default-features = false, features = ["agent", "rustls"] }
futures = "0.3"
serde_json = "1.0"
tokio = { version = "1.0", features = ["macros", "rt", "sync", "time", "process", "signal", "io-util", "io-std", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tempfile = "3.20"
tokio = { version = "1.0", features = ["net"] }

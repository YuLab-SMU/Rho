[package]
name = "rho-agent-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-only"
repository = "https://github.com/YuLab-SMU/Rho"

[dependencies]
rho-agent-api = { path = "../../api" }
rho-agent-owner = { path = "../owner" }
rho-agent-client = { path = "../client" }
async-trait = "0.1"
http-body = "1.0"
base64 = "0.22"
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.0", features = ["macros", "rt", "sync", "time", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
rmcp = { version = "1.8", default-features = false, features = ["server", "transport-streamable-http-server"] }
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json"] }
rho-agent-store = { path = "../store" }
tempfile = "3.20"

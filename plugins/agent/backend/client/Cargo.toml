[package]
name = "rho-agent-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-only"
repository = "https://github.com/YuLab-SMU/Rho"

[dependencies]
rho-agent-api = { path = "../../api" }
serde_json = "1.0"
tokio = { version = "1.0", features = ["macros", "rt", "sync", "time", "process", "signal", "io-util", "io-std", "fs"] }
tokio-util = { version = "0.7", features = ["rt", "codec"] }
futures = "0.3"
uuid = { version = "1.18", features = ["v4"] }
async-trait = "0.1"
base64 = "0.22"
sha2 = "0.10"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

[dev-dependencies]
tempfile = "3.20"
tokio = { version = "1.0", features = ["test-util"] }

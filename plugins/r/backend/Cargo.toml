[package]
name = "rho-r-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-only"
repository = "https://github.com/YuLab-SMU/Rho"

[dependencies]
rho-plugin-sdk = { path = "../../../crates/plugin-sdk" }
rho-r-api = { path = "../api" }
rho-r-engine = { path = "engine" }
rho-environment-api = { path = "../../environment/api" }
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.0", features = ["macros", "rt", "sync", "time", "io-std"] }

[dev-dependencies]
tempfile = "3.20"

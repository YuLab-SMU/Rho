[package]
name = "rho-r-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-only"
repository = "https://github.com/YuLab-SMU/Rho"

[dependencies]
base64 = "0.22.1"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
async-trait = "0.1"
jet_core = { path = "../../../../vendor/jet-core" }
rho-r-api = { path = "../../api" }
rho-plugin-protocol = { path = "../../../../crates/plugin-protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.0", features = ["macros", "rt", "sync", "time", "process", "io-util", "fs"] }
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies]
tempfile = "3.20"

[package]
name = "rho-r-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-only"
repository = "https://github.com/YuLab-SMU/Rho"

[dependencies]
rho-plugin-protocol = { path = "../../../crates/plugin-protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.0"
ts-rs = { version = "=12.0.1", features = ["serde-json-impl", "no-serde-warnings"] }
async-trait = "0.1"
tokio = { version = "1.0", features = ["sync"] }

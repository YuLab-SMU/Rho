[package]
name = "rho-environment-owner"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-only"
repository = "https://github.com/YuLab-SMU/Rho"

[dependencies]
rho-environment-api = { path = "../../api" }
rho-process-engine = { path = "../../../process/backend/engine" }
rho-process-owner = { path = "../../../process/backend/owner" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"
tokio = { version = "1.0", features = ["macros", "rt", "process", "sync", "time"] }

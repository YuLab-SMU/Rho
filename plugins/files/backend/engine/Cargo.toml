[package]
name = "rho-files-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-only"
repository = "https://github.com/YuLab-SMU/Rho"

[dependencies]
async-trait = "0.1"
rho-files-api = { path = "../../api" }
rho-process-engine = { path = "../../../../crates/process-engine" }
sha2 = "0.10"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.0", features = ["macros", "rt", "sync", "time", "process", "io-util", "fs"] }
fs4 = { version = "1", default-features = false, features = ["sync"] }

[dev-dependencies]
tempfile = "3.20"

[package]
name = "rho-files-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-only"
repository = "https://github.com/YuLab-SMU/Rho"

[dependencies]
rho-plugin-sdk = { path = "../../../crates/plugin-sdk" }
rho-files-api = { path = "../api" }
rho-files-engine = { path = "engine" }
rho-files-owner = { path = "owner" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.0"
tokio = { version = "1.0", features = ["macros", "rt", "sync", "time", "io-std"] }

[dev-dependencies]
tempfile = "3.20"

[[bin]]
name = "rho-files-backend"
path = "src/main.rs"

[[bin]]
name = "export-files-manifest"
path = "src/bin/export-files-manifest.rs"
test = false
bench = false

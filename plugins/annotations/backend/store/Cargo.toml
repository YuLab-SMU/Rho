[package]
name = "rho-annotation-store"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-only"
repository = "https://github.com/YuLab-SMU/Rho"

[dependencies]
rho-annotation-api = { path = "../../api" }
rho-annotation-owner = { path = "../owner" }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.20"

[package]
name = "rho-annotation-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-only"
repository = "https://github.com/YuLab-SMU/Rho"

[dependencies]
rho-annotation-api = { path = "../api" }
rho-annotation-owner = { path = "owner" }
rho-annotation-store = { path = "store" }
rho-plugin-sdk = { path = "../../../crates/plugin-sdk" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.0"
uuid = { version = "1.18", features = ["v4"] }
tokio = { version = "1.0", features = ["macros", "rt", "sync", "io-std"] }

[dev-dependencies]
tokio = { version = "1.0", features = ["time"] }
tempfile = "3.20"

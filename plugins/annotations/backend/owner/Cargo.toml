[package]
name = "rho-annotation-owner"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-only"
repository = "https://github.com/YuLab-SMU/Rho"

[dependencies]
rho-annotation-api = { path = "../../api" }
serde = { version = "1.0", features = ["derive"] }

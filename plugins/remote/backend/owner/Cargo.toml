[package]
name = "rho-remote-owner"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-only"
repository = "https://github.com/YuLab-SMU/Rho"

[dependencies]
rho-plugin-protocol = { path = "../../../../crates/plugin-protocol" }
rho-remote-api = { path = "../../api" }
rho-process-api = { path = "../../../process/api" }
rho-process-engine = { path = "../../../process/backend/engine" }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.0", features = ["rt", "process", "sync", "time", "macros"] }

[dev-dependencies]
tempfile = "3.20"

- insert:
    - id: rho-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: rho
        transport: stdio
        command: !!js process.env.RHO_DSH_COMMAND || 'rho'
        args:
          - --mcp
          - !!js process.env.RHO_DSH_CONNECTION
        failOnStartupError: true
        toolCallTimeoutMs: 300000
    - id: dsh-rho
      name: dsh-rho
      config:
        connectionFile: !!js process.env.RHO_DSH_CONNECTION

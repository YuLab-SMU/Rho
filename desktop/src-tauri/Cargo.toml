[package]
name = "rho-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
base64 = "0.22"
chrono.workspace = true
flate2 = "1"
minisign-verify = "0.2"
notify = "8.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rho-core = { path = "../../crates/rho-core" }
rho-extension-runtime = { path = "../../crates/rho-extension-runtime" }
rho-kernel = { path = "../../crates/rho-kernel" }
rho-protocol = { path = "../../crates/rho-protocol" }
rho-server = { path = "../../crates/rho-server" }
rho-store = { path = "../../crates/rho-store" }
rfd = "0.15"
serde.workspace = true
serde_json.workspace = true
semver = "1.0"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2.10.1"
tempfile.workspace = true
tar = "0.4"
tokio.workspace = true
uuid.workspace = true
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
keyring = { version = "4.1.6", default-features = false, features = ["v1", "windows-native-keyring-store"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "4.1.6", default-features = false, features = ["v1"] }

[target.'cfg(target_os = "linux")'.dependencies]
# LIN6: the keyring 4.1.6 `v1` feature selects zbus-secret-service-keyring-store
# on Linux (Secret Service over DBus). Same library and version as Windows/macOS;
# all backend crates are already resolved in the committed Cargo.lock.
keyring = { version = "4.1.6", default-features = false, features = ["v1"] }

[dev-dependencies]
rusqlite.workspace = true
wat.workspace = true

[package]
name = "rho-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json.workspace = true

[dependencies]
anyhow.workspace = true
base64 = "0.22"
chrono.workspace = true
dirs = "6"
libc.workspace = true
flate2 = "1"
minisign-verify = "0.2"
notify = "8.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rand.workspace = true
rho-core = { path = "../../crates/rho-core" }
rho-acp-client = { path = "../../crates/rho-acp-client" }
rho-control-plane = { path = "../../crates/rho-control-plane" }
rho-extension-runtime = { path = "../../crates/rho-extension-runtime" }
rho-evidence-graph = { path = "../../crates/rho-evidence-graph" }
rho-environment = { path = "../../crates/rho-environment" }
rho-kernel = { path = "../../crates/rho-kernel" }
rho-protocol = { path = "../../crates/rho-protocol" }
rho-server = { path = "../../crates/rho-server" }
rho-sandbox = { path = "../../crates/rho-sandbox" }
rho-store = { path = "../../crates/rho-store" }
rho-ui-contract = { path = "../../crates/rho-ui-contract" }
rho-workspace = { path = "../../crates/rho-workspace" }
rfd = "0.15"
serde.workspace = true
serde_json.workspace = true
semver = "1.0"
sha2 = "0.10"
specta.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2.10.1"
tempfile.workspace = true
tar = "0.4"
tokio.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# Debug-only acceptance bridge viewport capture. Versions match the committed
# Cargo.lock transitive set (wry 0.55.1 / tauri 2.11.5) with default features
# off, so no new dependency graph entries are introduced; only reachable from
# cfg(debug_assertions) code.
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSAlert", "NSApplication", "NSBitmapImageRep", "NSButton", "NSControl", "NSImage", "NSImageRep", "NSResponder", "NSScrollView", "NSTextField", "NSView", "NSWindow", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSData", "NSDictionary", "NSError", "NSNotification", "NSOperation", "NSString", "objc2-core-foundation"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["WKSnapshotConfiguration", "WKWebView", "block2", "objc2-app-kit"] }

[dev-dependencies]
rusqlite.workspace = true
specta-typescript.workspace = true
tauri-specta.workspace = true
wat.workspace = true
wit-component.workspace = true
wit-parser.workspace = true

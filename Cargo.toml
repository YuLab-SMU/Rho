[workspace]
resolver = "3"
members = [
  "crates/rho-ui-contract",
  "crates/rho-extension-runtime",
  "crates/rho-plugin-dev",
  "crates/rho-protocol",
  "crates/rho-store",
  "crates/rho-evidence-graph",
  "crates/rho-environment",
  "crates/rho-artifact-store",
  "crates/rho-secret-broker",
  "crates/rho-sandbox",
  "crates/rho-event-hub",
  "crates/rho-execution",
  "crates/rho-control-plane",
  "crates/rho-acp-client",
  "crates/rho-agent-host",
  "crates/rho-workspace",
  "crates/rho-runner",
  "crates/rho-test-support",
  "crates/rho-telemetry",
  "crates/rho-architecture-tests",
  "crates/rho-kernel",
  "crates/rho-agent-transport",
  "crates/rho-core",
  "crates/rho-server",
  "crates/rho-cli",
  "crates/rho-mcp",
  "crates/rho-updater-verifier",
  "desktop/src-tauri",
]
exclude = ["vendor/jet"]

[workspace.package]
version = "0.4.1-dev.22"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-only"
repository = "https://github.com/YuLab-SMU/Rho"

[workspace.dependencies]
anyhow = "1.0"
arc-swap = { version = "1.9", default-features = false }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
jet_core = { path = "vendor/jet/crates/core" }
include_dir = "0.7.4"
lbug = "=0.20.1"
libc = "0.2"
rand = "0.9"
petgraph = { version = "0.8", default-features = false, features = ["std"] }
rusqlite = { version = "0.37", features = ["bundled"] }
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_norway = "0.9.42"
sha2 = "0.10"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
sysinfo = { version = "0.39.6", default-features = false, features = ["disk", "system"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
tempfile = "3.20"
thiserror = "2.0"
toml = "0.8"
toml_edit = "0.22.27"
tokio = { version = "1.0", features = ["full"] }
tokio-rusqlite = "=0.7.0"
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
uuid = { version = "1.18", features = ["v4", "v7", "serde"] }
wasmtime = { version = "=38.0.4", default-features = false, features = ["component-model", "cranelift", "runtime", "std"] }
wat = { version = "=1.257.1", default-features = false, features = ["component-model"] }
wit-component = { version = "=0.239.0", default-features = false }
wit-parser = "=0.239.0"
zeroize = { version = "1.9", features = ["serde"] }

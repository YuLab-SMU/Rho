[workspace]
resolver = "3"
members = [
  "crates/rho-extension-runtime",
  "crates/rho-protocol",
  "crates/rho-store",
  "crates/rho-kernel",
  "crates/rho-agent-transport",
  "crates/rho-core",
  "crates/rho-cli",
  "crates/rho-mcp",
  "crates/rho-server",
  "crates/rho-updater-verifier",
  "desktop/src-tauri",
]
exclude = ["vendor/jet"]

[workspace.package]
version = "0.4.1-dev.9"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
repository = "https://github.com/YuLab-SMU/Rho"

[workspace.dependencies]
anyhow = "1.0"
arc-swap = { version = "1.9", default-features = false }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
jet_core = { path = "vendor/jet/crates/core" }
libc = "0.2"
rand = "0.9"
petgraph = { version = "0.8", default-features = false, features = ["std"] }
rusqlite = { version = "0.37", features = ["bundled"] }
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.0", features = ["full"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
wasmtime = { version = "=38.0.4", default-features = false, features = ["cranelift", "runtime", "std"] }
wat = { version = "=1.257.1", default-features = false }
zeroize = "1.9"

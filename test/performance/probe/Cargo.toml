[package]
name = "rho-performance-probe"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
rho-agent-host = { path = "../../../crates/rho-agent-host" }
rho-artifact-store = { path = "../../../crates/rho-artifact-store" }
